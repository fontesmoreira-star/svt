<html lang="fr">
<head>
<meta charset="utf-8">

<title>Automatismes 3e SVT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123d2a'/%3E%3Cpath d='M20 12c0 14 24 26 24 40M44 12c0 14-24 26-24 40' stroke='%236fcf97' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M23 22h18M23 42h18M27 32h10' stroke='%23eaf5ee' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout : bandeau SVT vert foncé ; vues Sommaire (missions → tuiles de séances), Séance (barre collante avec minuteur, 4 cartes-questions dont le document animé), Révision, Progression, Bilan ; colonne 980 px (1400 px en projection) */
:root{
  --bg:#eff4f1; --surface:#ffffff; --surface-2:#e3ede7; --ink:#0f2d36; --muted:#46626c; --line:#bfd2d4;
  --teal:#1f6b45; --teal-ink:#ffffff; --teal-soft:#dbeee2;
  --band:#123d2a; --band-ink:#eaf5ee; --band-muted:#a8cdb5;
  --ok:#17703c; --ok-soft:#dcf1e3; --bad:#b3261e; --bad-soft:#fbe2df;
  --info:#1d5fa8; --info-soft:#e4eefb; --warn:#a14f00; --warn-soft:#fdebd6; --key:#17703c; --key-soft:#dcf1e3;
  --t-r6:#6a3fa0; --t-sp:#0b6170; --t-se:#a14f00; --t-doc:#1d5fa8;
  --sky:#0e1a2b; --sun:#f2b705; --sunglow:rgba(242,183,5,.35); --water:#4b9fd6; --water-2:#2f7fb5; --ice:#cfe8f7;
  --blood:#c62828; --blood-2:#6d4c8a; --leaf:#3f8f3a; --leaf-2:#8cc66b; --bark:#8a5a2b; --soil:#7a5536;
  --org:#d9822b; --bact:#cf5d17; --nerve:#e0b100; --muscle:#d9665b; --bone:#e9e2cf; --skin:#f1c9a5;
  --metal:#7d8d93; --wire:#37474f; --lamp:#ffd54f; --iodine-b:#1b1d4a; --iodine-y:#c9a227; --lava:#e65100; --rock:#4e4a47; --rock-l:#c9bfae;
  --paper:#fffdf6; --o2:#1d5fa8; --co2:#7a6b5d; --glu:#d39b00;
  --f-display:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:22px; --maxw:980px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b171b; --surface:#12242a; --surface-2:#1a3138; --ink:#e4eff1; --muted:#a3bac1; --line:#2f4a52;
  --teal:#6fcf97; --teal-ink:#06261a; --teal-soft:#173a28;
  --band:#0b2a1c; --band-ink:#e4f2ea; --band-muted:#93c2a6;
  --ok:#66d695; --ok-soft:#173826; --bad:#ff8f84; --bad-soft:#3d1c1a;
  --info:#8ab8f2; --info-soft:#15263b; --warn:#f3a95c; --warn-soft:#352310; --key:#66d695; --key-soft:#173826;
  --t-r6:#c2a6f2; --t-sp:#5cc6d3; --t-se:#f3a95c; --t-doc:#8ab8f2;
  --sky:#050b14; --water:#3d8fc0; --water-2:#2a6f9e; --ice:#9fc6de; --blood:#ef5350; --blood-2:#9575cd; --leaf:#5cae55; --leaf-2:#9fd17f; --bark:#b07a44; --soil:#9b7350;
  --metal:#9aaab0; --wire:#b0bec5; --bone:#d8d0bb; --rock:#8a8580; --rock-l:#d8cfbf; --paper:#1d2a22; --o2:#8ab8f2; --co2:#b6a898;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b171b; --surface:#12242a; --surface-2:#1a3138; --ink:#e4eff1; --muted:#a3bac1; --line:#2f4a52;
  --teal:#6fcf97; --teal-ink:#06261a; --teal-soft:#173a28;
  --band:#0b2a1c; --band-ink:#e4f2ea; --band-muted:#93c2a6;
  --ok:#66d695; --ok-soft:#173826; --bad:#ff8f84; --bad-soft:#3d1c1a;
  --info:#8ab8f2; --info-soft:#15263b; --warn:#f3a95c; --warn-soft:#352310; --key:#66d695; --key-soft:#173826;
  --t-r6:#c2a6f2; --t-sp:#5cc6d3; --t-se:#f3a95c; --t-doc:#8ab8f2;
  --sky:#050b14; --water:#3d8fc0; --water-2:#2a6f9e; --ice:#9fc6de; --blood:#ef5350; --blood-2:#9575cd; --leaf:#5cae55; --leaf-2:#9fd17f; --bark:#b07a44; --soil:#9b7350;
  --metal:#9aaab0; --wire:#b0bec5; --bone:#d8d0bb; --rock:#8a8580; --rock-l:#d8cfbf; --paper:#1d2a22; --o2:#8ab8f2; --co2:#b6a898;
  color-scheme:dark;
}
html{font-size:var(--fs)}
html.proj{--maxw:1400px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:16px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--band-muted)}
.band h1{font-size:clamp(1.4rem,4.4vw,2.1rem);font-weight:800;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{min-height:48px;min-width:48px;padding:0 12px;border-radius:12px;border:1.5px solid color-mix(in oklab,var(--band-ink) 35%,transparent);background:transparent;color:var(--band-ink);font-weight:700;cursor:pointer;font-size:.9rem}
.tbtn[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

main .wrap{padding-block:22px 64px}
section.view{display:flex;flex-direction:column;gap:20px}
.kicker{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.h2{font-size:clamp(1.3rem,3.4vw,1.75rem);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--teal);background:var(--teal);color:var(--teal-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn{max-width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.weak .btn{white-space:normal;justify-content:flex-start;text-align:left;padding-block:8px}
@media (max-width:560px){.hl{display:none}.sbar .ttl{font-size:.95rem}.sbar .wrap{gap:6px 8px}}
.btn.sm{min-height:48px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}

.box{border-radius:14px;padding:12px 16px;border-left:6px solid;display:flex;flex-direction:column;gap:6px;min-width:0}
.box .bt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.box.info{background:var(--info-soft);border-color:var(--info)}.box.info .bt{color:var(--info)}
.box.warn{background:var(--warn-soft);border-color:var(--warn)}.box.warn .bt{color:var(--warn)}
.box.key{background:var(--key-soft);border-color:var(--key)}.box.key .bt{color:var(--key)}

/* Sommaire */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:.9rem;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-num);font-weight:700;font-size:1.25rem}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.mission{display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.mhead h3{font-size:1.1rem;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.tile{min-height:96px;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tn{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.tile .tt{font-size:.9rem;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{font-family:var(--f-num);font-size:.9rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap}
.badge.full{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.badge.part{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tile.cur{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}

/* Séance */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-block:6px}
.sbar .ttl{font-weight:800;min-width:0}
.timer{display:flex;align-items:center;gap:6px}
.tclock{font-family:var(--f-num);font-weight:700;font-size:1.15rem;min-width:4.2ch;text-align:center;padding:4px 10px;border-radius:10px;background:var(--surface-2)}
.tclock.low{background:var(--warn-soft);color:var(--warn)}
.tclock.end{background:var(--bad-soft);color:var(--bad)}
.ibtn{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.sco{font-family:var(--f-num);font-weight:700;padding:4px 10px;border-radius:10px;background:var(--teal-soft)}
.shead{display:flex;flex-direction:column;gap:4px}
.snav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:80px}
.qhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.qnum{font-family:var(--f-num);font-weight:800;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--teal-ink);flex:none}
.tag{font-size:.9rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor;display:inline-block;max-width:100%}
.tag.r6{color:var(--t-r6)}.tag.sp{color:var(--t-sp)}.tag.se{color:var(--t-se)}.tag.doc{color:var(--t-doc)}
a.tag{text-decoration:none}
.qstat{margin-left:auto;font-size:.9rem;font-weight:700;color:var(--muted)}
.qstat.ok{color:var(--ok)}.qstat.bad{color:var(--bad)}
.qtext{font-weight:700;font-size:1.05rem}
.ins{font-size:.9rem;color:var(--muted)}
.part{display:flex;flex-direction:column;gap:8px;min-width:0}
.part+.part{border-top:1px dashed var(--line);padding-top:12px}
.pq{font-weight:700}
.fields{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.grow{flex:1 1 260px}
.field label{font-size:.9rem;font-weight:700;color:var(--muted)}
.inp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input.ans{min-height:52px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1rem;min-width:0;width:100%}
input.ans.num{width:8ch;font-family:var(--f-num);font-weight:700}
input.ans.good{border-color:var(--ok);background:var(--ok-soft)}
input.ans.badi{border-color:var(--bad);background:var(--bad-soft)}
.mk{font-weight:700;font-size:.9rem;white-space:nowrap}
.mk.ok{color:var(--ok)}.mk.bad{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between}
.opt .ck{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.9rem;font-weight:800}
.opt.radio .ck{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.opt[aria-pressed="true"] .ck{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.opt.okm{border-color:var(--ok);background:var(--ok-soft)}
.opt.badm{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.35;text-decoration:line-through;pointer-events:none}
.ordbox{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:12px;border:2px dashed var(--line);background:var(--bg);align-items:center}
.ordbox.okb{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.ordbox.badb{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.chipw{min-height:48px;padding:0 14px;border-radius:999px;border:2px solid var(--teal);background:var(--surface);font-weight:700;cursor:pointer}
.chipw.placed{background:var(--teal-soft)}
.chipw .no{font-family:var(--f-num);margin-right:6px;color:var(--teal)}
.chipw:disabled{border-color:var(--line);color:var(--muted);opacity:.5}
.mrow{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.mrow .rl{font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qbtns{display:flex;flex-wrap:wrap;gap:10px}
.fb{border-radius:12px;padding:10px 14px}
.fb.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.hint{background:var(--warn-soft);border-radius:12px;padding:10px 14px}
.hint b{color:var(--warn)}
.corr{border-left:5px solid var(--key);background:var(--key-soft);border-radius:0 12px 12px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.corr .ct{font-weight:700;color:var(--key)}

/* Document animé */
.doc{display:flex;flex-direction:column;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px;min-width:0}
.dcap{font-style:italic;color:var(--muted)}
.anim{display:flex;flex-direction:column;gap:10px;min-width:0}
.anim .stage-wrap{background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden;min-width:0}
svg.stg{display:block;width:100%;height:auto;font-family:var(--f-body)}
svg.stg text{fill:var(--ink);font-size:18px}
svg.stg text.m{fill:var(--muted)}
svg.stg text.b{font-weight:700}
svg.stg text.w{fill:#fff}
svg.stg .tk{stroke:var(--ink);stroke-width:2}
svg.stg .ln{stroke:var(--line);stroke-width:1}
.actl{display:flex;flex-wrap:wrap;gap:8px}
.anote{font-size:.9rem;color:var(--muted)}
.alive{min-height:1.5em;font-weight:700;color:var(--teal)}
.simtag{align-self:flex-start;font-size:.9rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 10px;border-radius:999px}
.dtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:10px;overflow:hidden}
.dtable th,.dtable td{padding:7px 10px;border:1px solid var(--line);text-align:left;font-size:.95rem}
.dtable th{background:var(--teal-soft)}
.tscroll{overflow-x:auto;border-radius:10px}
.endcard{background:var(--band);color:var(--band-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.endcard .big{font-family:var(--f-num);font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem)}
.endcard .muted{color:var(--band-muted)}
.endcard .btn.ghost{color:var(--band-ink);border-color:var(--band-muted)}

/* Progression / bilan */
.pbar{display:flex;flex-direction:column;gap:6px}
.pbar .pl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.track{height:16px;border-radius:8px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.track span{display:block;height:100%;background:var(--ok)}
.weak{display:flex;flex-direction:column;gap:8px}
.weak button{text-align:left}
.bilantext{white-space:pre-wrap;font-family:var(--f-num);font-size:.9rem;background:var(--surface-2);border-radius:12px;padding:14px;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
input.name{min-height:52px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);width:min(100%,16em)}
.overlay{position:fixed;inset:0;z-index:20;background:var(--surface);overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovin{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ovname{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3.6rem)}
.ovtot{font-family:var(--f-num);font-weight:700;font-size:clamp(2.6rem,11vw,5.4rem);color:var(--teal);line-height:1}
.ovlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.ovitem{background:var(--surface-2);border-radius:12px;padding:12px;font-size:1.2rem;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* Hébergement classique (GitHub Pages) : le bilan se télécharge comme un fichier .txt */
(function(){
  if(window.claude) return;
  function save(o){
    return new Promise(function(res,rej){
      try{
        var txt=(o&&o.data!=null)?String(o.data):"";
        var blob=new Blob(["\ufeff"+txt],{type:"text/plain;charset=utf-8"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=(o&&o.filename)||"bilan.txt"; a.style.display="none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(url); a.remove();},15000);
        res();
      }catch(e){ rej({code:"failed"}); }
    });
  }
  window.claude={use:function(name){
    return name==="downloads" ? Promise.resolve({save:save}) : Promise.reject(new Error("indisponible"));
  }};
})();
</script>

<body>
<header class="band" id="band">
  <div class="wrap">
    <div style="min-width:0">
      <div class="eyebrow">3e SVT · Début de cours · 5 minutes</div>
      <h1>Automatismes</h1>
    </div>
    <div class="tools" role="group" aria-label="Affichage">

/* ---------- texte tolérant ---------- */
function nz(s){return String(s==null?"":s).toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/₂/g,"2").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let p=new Array(n+1);for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function has(t,alts,exact){const T=" "+t+" ",toks=t.split(" ");return alts.split("|").some(st=>{st=nz(st);if(!st)return false;if(T.indexOf(" "+st)>=0)return true;
  if(!exact&&st.indexOf(" ")<0&&st.length>=5){const tol=st.length>=9?2:1;return toks.some(w=>w.length>=st.length-1&&lev(w.slice(0,st.length),st)<=tol);}return false;});}
function parseNum(s){const t=String(s==null?"":s).trim().replace(/\s/g,"").replace(/[−–]/g,"-").replace(",",".");return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):null;}

/* ---------- mélange déterministe ---------- */
function seedOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function perm(n,seed){const a=[...Array(n).keys()];let x=seed||1;for(let i=n-1;i>0;i--){x=(Math.imul(x,1103515245)+12345)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  if(n>1&&a.every((v,i)=>v===i)){a.push(a.shift());}return a;}

/* ---------- évaluation ---------- */
function evalPart(p,a){
  switch(p.t){
    case "txt":{const t=nz(a);if(!t)return {empty:true};
      if(p.bad&&has(t,p.bad,true))return {ok:false};
      if(p.p){const f=p.p.filter(x=>has(t,x)).length;return {ok:f>=p.n,found:f};}
      const al=Array.isArray(p.a)?p.a:[p.a];return {ok:al.every(x=>has(t,x))};}
    case "txtf":{const v=a||[];if(p.f.some((f,i)=>!nz(v[i])))return {empty:true};const m=p.f.map((f,i)=>{const t=nz(v[i]);const al=Array.isArray(f.a)?f.a:[f.a];return al.every(x=>has(t,x));});return {ok:m.every(Boolean),m};}
    case "mcq":{if(a==null)return {empty:true};return {ok:a===0};}
    case "multi":{const v=a||[];if(!v.length)return {empty:true};const wrong=v.some(i=>i>=p.k),good=v.filter(i=>i<p.k).length;return {ok:!wrong&&(p.min?good>=p.min:good===p.k)};}
    case "num":{const v=a||[];const x=p.f.map((f,i)=>parseNum(v[i]));if(x.some(y=>y===null))return {empty:true};const m=p.f.map((f,i)=>Math.abs(x[i]-f.v)<=f.tol+1e-9);
      let msg="";p.f.forEach((f,i)=>{if(!m[i]&&f.alt&&f.alt.some(z=>Math.abs(x[i]-z[0])<1e-9))msg=f.alt.find(z=>Math.abs(x[i]-z[0])<1e-9)[1];});return {ok:m.every(Boolean),m,msg};}
    case "order":{const v=a||[];if(v.length<p.o.length)return {empty:true};const m=v.map((x,i)=>x===i);return {ok:m.every(Boolean),m};}
    case "match":{const v=a||[];if(p.r.some((r,i)=>v[i]==null))return {empty:true};const m=p.r.map((r,i)=>v[i]===p.a[i]);return {ok:m.every(Boolean),m};}
  }
  return {ok:false};
}
function evalQ(q,ans){const rs=q.spec.parts.map((p,i)=>evalPart(p,ans[i]));return {parts:rs,empty:rs.some(r=>r.empty),ok:rs.every(r=>r.ok)};}

/* ---------- coups de pouce ---------- */
const ART=/^(le |la |les |l'|l’|un |une |des |du |de la |de l'|d'|en |dans |au |aux |par |se |sa |son |ses )+/i;
function words(s){return String(s).split(/\s*,\s*|\s+et\s+|\s*;\s*/).map(w=>w.replace(ART,"").replace(/\(.*?\)/g,"").replace(/…/g,"").trim()).filter(Boolean);}
function txtHint(s,L){const w=words(s);if(L===1)return "Commence par « "+w.map(x=>x[0].toUpperCase()+"…").join(" », « ")+" ».";return w.map(x=>"« "+x.slice(0,Math.max(2,Math.ceil(x.length/2)))+"… » ("+x.replace(/[\s’'-]/g,"").length+" lettres)").join(" ; ");}
function wrongOrder(q,pi,p){return perm(p.o.length,seedOf(q.id+"w"+pi)).filter(i=>i>=(p.t==="multi"?p.k:1));}
function hintFx(q,L){ // effets cumulés pour le niveau L
  const fx={txt:[],gone:{},ord:{},mt:{}};const sp=q.spec;const steps=[];
  if(sp.h)steps.push({h:sp.h});steps.push({lv:1});if(!sp.h)steps.push({lv:2});
  for(let s=0;s<Math.min(L,steps.length);s++){const st=steps[s];
    if(st.h){fx.txt.push(st.h);continue;}
    sp.parts.forEach((p,pi)=>{const pre=sp.parts.length>1?"Partie "+(pi+1)+" : ":"";const lv=st.lv;
      if(p.t==="txt"){fx.txt.push(pre+(p.h&&lv===1?p.h:txtHint(p.s,lv)));}
      else if(p.t==="txtf"){p.f.forEach(f=>fx.txt.push(pre+f.l+" — "+txtHint(f.s,lv)));}
      else if(p.t==="mcq"){const n=Math.min(lv,p.o.length-2);if(n>0){fx.gone[pi]=n;fx.txt.push(pre+(n>1?n+" mauvaises réponses sont barrées.":"Une mauvaise réponse est barrée."));}else fx.txt.push(pre+"Relis bien la question et le document : une seule réponse est juste.");}
      else if(p.t==="multi"){if(lv===1)fx.txt.push(pre+"Il y a "+p.k+" bonne"+(p.k>1?"s":"")+" réponse"+(p.k>1?"s":"")+(p.min?" (il en faut au moins "+p.min+")":"")+".");else{fx.gone[pi]=1;fx.txt.push(pre+"Une mauvaise réponse est barrée.");}}
      else if(p.t==="num"){if(lv===1)fx.txt.push(pre+(p.h||"Relis le document et pose le calcul dans ton cahier."));else p.f.forEach(f=>{const d=Math.max(1,Math.abs(f.v)*.25);fx.txt.push(pre+f.l+" : entre "+frn(Math.floor(f.v-d))+" et "+frn(Math.ceil(f.v+d))+(f.u?" "+f.u:"")+".");});}
      else if(p.t==="order"){fx.ord[pi]=Math.min(lv,p.o.length-1);fx.txt.push(pre+"Début de l'ordre : "+p.o.slice(0,fx.ord[pi]).join(" → ")+" → …");}
      else if(p.t==="match"){fx.mt[pi]=Math.min(lv,p.r.length-1);for(let r=0;r<fx.mt[pi];r++)fx.txt.push(pre+"« "+p.r[r]+" » → « "+p.c[p.a[r]]+" »");}
    });
  }
  return {fx,max:steps.length};
}

/* 14 · Volume crânien */
ANIMS.cranial=(box)=>{
  const s=stage(box,640,330,"Volume crânien de fossiles de la lignée humaine en fonction de leur âge");
  const L=90,R=610,T=20,Bt=260,X=a=>L+(3.5-a)/3.5*(R-L),Y=v=>Bt-v/1500*(Bt-T);

  for(let a=3.5;a>=0;a-=.5){E("line",{x1:X(a),x2:X(a),y1:T,y2:Bt,class:"ln"},s);TX(s,X(a),Bt+20,frn(a),{"text-anchor":"middle",class:"m","font-size":14});}
  E("path",{d:`M${L} ${T}V${Bt}H${R}`,fill:"none",class:"tk"},s);
  TX(s,(L+R)/2,Bt+50,"Âge du fossile (millions d'années avant aujourd'hui)",{"text-anchor":"middle",class:"b","font-size":15});
  TX(s,0,0,"Volume crânien (cm³)",{"text-anchor":"middle",class:"b","font-size":15,transform:`translate(22 ${(T+Bt)/2}) rotate(-90)`});
  const F=[["Australopithèque",3.2,450],["Homo habilis",2.0,650],["Homo erectus",1.5,950],["Homo sapiens",0.3,1400]];
  const g=G(s),rd=live(box,"Touche un point pour lire ses valeurs.");
  function run(){g.innerHTML="";let k=0;const nx=()=>{if(k>=F.length)return;const f=F[k],x=X(f[1]),y=Y(f[2]);
      if(k){const p=F[k-1];const ln=E("line",{x1:X(p[1]),y1:Y(p[2]),x2:X(p[1]),y2:Y(p[2]),stroke:"var(--teal)","stroke-width":3,"stroke-dasharray":"6 5"},g);tween(500,e=>{ln.setAttribute("x2",lerp(X(p[1]),x,e));ln.setAttribute("y2",lerp(Y(p[2]),y,e));});}
      const c=E("circle",{cx:x,cy:y,r:Math.sqrt(f[2])/3,fill:"#d7ccc8",stroke:"#5d4037","stroke-width":2,style:"cursor:pointer"},g);c.addEventListener("pointerdown",()=>{rd.textContent=f[0]+" : il y a "+frn(f[1])+" millions d'années, "+f[2].toLocaleString("fr-FR")+" cm³.";});
      TX(g,x,y-Math.sqrt(f[2])/3-8,f[0],{"text-anchor":k===3?"end":"middle","font-size":13,class:"b"});k++;tween(600,()=>{},nx);};nx();}
  ctl(box,[["▶ Placer les fossiles",run]]);run();
  note(box,"Ces espèces ne descendent pas forcément les unes des autres : ce sont des représentants de la lignée humaine à différentes époques.",false);
};

  const hy=G(s,{opacity:0});for(let i=0;i<22;i++){const x=200+(hash(i)-.5)*360,y=200+hash(i+5)*120;E("path",{d:`M${200+(i%7-3)*24} 240 Q${(x+200)/2} ${y-20} ${x} ${y}`,stroke:"#fafafa","stroke-width":1.6,fill:"none"},hy);}

/* 18 · Barrières et infection */
ANIMS.barriers=(box)=>{
  const s=stage(box,640,300,"Peau intacte puis coupée : contamination et infection");
  E("rect",{x:0,y:0,width:640,height:120,fill:"#e3f2fd"},s);const skin=E("rect",{x:0,y:120,width:640,height:30,fill:"#f8bbd0",stroke:"#ad1457"},s);E("rect",{x:0,y:150,width:640,height:150,fill:"#ffebee"},s);
  TX(s,10,140,"peau",{"font-size":14,class:"b"});TX(s,10,290,"intérieur du corps",{"font-size":14,class:"m"});
  const cut=E("rect",{x:300,y:118,width:40,height:34,fill:"#e3f2fd",opacity:0},s);
  const M=[];for(let i=0;i<14;i++)M.push({x:hash(i)*620+10,y:hash(i+4)*90+15,vx:(hash(i+7)-.5)*80,vy:(hash(i+8)-.5)*80,inside:false,e:E("circle",{r:6,fill:"#43a047"},s)});
  let open=false,t=0;const cnt=TX(s,630,290,"",{"text-anchor":"end",class:"b","font-size":15});const msg=live(box,"La peau intacte arrête les micro-organismes.");
  loop(dt=>{t+=dt;M.forEach(m=>{m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<6||m.x>634)m.vx*=-1;
      if(!m.inside){if(m.y<8)m.vy=Math.abs(m.vy);if(m.y>112){if(open&&m.x>300&&m.x<340){m.inside=true;m.vy=Math.abs(m.vy)+20;}else m.vy=-Math.abs(m.vy);}}
      else{if(m.y<160)m.vy=Math.abs(m.vy);if(m.y>292)m.vy=-Math.abs(m.vy);}
      if(open&&!m.inside&&Math.abs(m.x-320)<120&&m.y>60)m.vx+=(320-m.x)*dt*.8;
      m.e.setAttribute("cx",m.x);m.e.setAttribute("cy",m.y);});
    const ins=M.filter(m=>m.inside);if(ins.length&&ins.length<70&&Math.random()<dt*ins.length*.12){const p=ins[Math.floor(Math.random()*ins.length)];M.push({x:p.x,y:p.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,inside:true,e:E("circle",{r:6,fill:"#43a047"},s)});}
    cnt.textContent=ins.length?ins.length+" micro-organismes dans le corps":"";
    if(open)msg.textContent=ins.length<4?"Contamination : les micro-organismes entrent par la plaie.":"Infection : ils se multiplient à l'intérieur du corps.";});
  ctl(box,[["✂︎ Couper la peau",()=>{open=true;cut.setAttribute("opacity",1);}],["↺ Peau intacte",()=>{open=false;cut.setAttribute("opacity",0);M.splice(14).forEach(m=>m.e.remove());M.forEach((m,i)=>{m.inside=false;m.y=hash(i+4)*90+15;});msg.textContent="La peau intacte arrête les micro-organismes.";}]]);
};

  const lawn=G(s);const pts=[];for(let i=0;i<1400;i++){const a=hash(i)*Math.PI*2,r=Math.sqrt(hash(i+.5))*R*.97;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);if(pa.some(p=>Math.hypot(x-p[2],y-p[3])<p[1]/2*K))continue;pts.push(E("circle",{cx:x,cy:y,r:2.2,fill:"#c0ca33",opacity:0},lawn));}

  const res=G(s,{opacity:0});pa.forEach((p,i)=>TX(res,420,90+i*60,"Pastille "+p[0]+" : zone de "+p[1]+" mm",{class:"b","font-size":15}));

  ctl(box,[["▶ Incuber 24 h",()=>{meas.setAttribute("opacity",0);res.setAttribute("opacity",0);tween(2200,(e,u)=>{const k=Math.round(pts.length*u);pts.forEach((p,i)=>p.setAttribute("opacity",i<k?.9:0));},()=>{msg.textContent="Autour de chaque pastille, une zone reste sans bactéries.";});}],
    ["📏 Mesurer les zones",()=>{meas.setAttribute("opacity",1);res.setAttribute("opacity",1);msg.textContent="La zone la plus large est autour de A (22 mm) : c'est l'antibiotique le plus efficace contre cette bactérie.";}]]);
};

/* 21 · Phagocytose */
ANIMS.phago=(box)=>{
  const s=stage(box,640,300,"Les quatre étapes de la phagocytose");
  const ph=E("path",{fill:"#e1bee7",stroke:"#6a1b9a","stroke-width":3},s);const nu=E("ellipse",{rx:20,ry:14,fill:"#8e24aa"},s);const vs=E("circle",{r:0,fill:"none",stroke:"#6a1b9a","stroke-width":3,"stroke-dasharray":"4 3"},s);
  const mic=G(s);let shape=0;const SH=[["bactérie",()=>E("rect",{x:-22,y:-11,width:44,height:22,rx:11,fill:"#a5d6a7",stroke:"#2e7d32","stroke-width":2},mic)],["levure",()=>E("ellipse",{rx:20,ry:16,fill:"#fff59d",stroke:"#f9a825","stroke-width":2},mic)],["autre bactérie",()=>{for(let k=0;k<3;k++)E("circle",{cx:-14+k*14,cy:0,r:7,fill:"#80cbc4",stroke:"#00695c","stroke-width":2},mic);}]];
  function drawMic(){mic.innerHTML="";SH[shape][1]();}
  const lab=TX(s,320,290,"",{"text-anchor":"middle",class:"b","font-size":15});
  function blob(cx,cy,arms,rad){let d="";const n=60;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;let r=rad*(1+.06*Math.sin(a*5));const toward=Math.cos(a);if(arms>0&&toward>0)r+=arms*Math.pow(toward,4)*rad*1.2;d+=(i?"L":"M")+(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1);}return d+"Z";}
  function set(p){const cx=220+Math.min(1,p)*60,cy=150;ph.setAttribute("d",blob(cx,cy,p<1?0:p<2?(p-1):p<3?1-(p-2):0,90));nu.setAttribute("cx",cx-40);nu.setAttribute("cy",cy);
    let mx=440-Math.min(1,p)*60,my=150,op=1,sc=1;if(p>=2){mx=lerp(380,cx+30,Math.min(1,p-2));}if(p>=3){mx=cx+30;op=Math.max(0,1-(p-3)*1.2);sc=1-(p-3)*.5;}
    mic.setAttribute("transform","translate("+mx+" "+my+") scale("+Math.max(.3,sc)+")");mic.setAttribute("opacity",op);
    vs.setAttribute("cx",cx+30);vs.setAttribute("cy",cy);vs.setAttribute("r",p>=2.6?30:0);
    lab.textContent=p<1?"1. Adhésion : le phagocyte se colle au micro-organisme":p<2?"2. Il l'entoure de prolongements":p<3?"3. Il l'ingère dans une vésicule":"4. Il le digère";}
  drawMic();player(box,4,.5,set);set(0);
  ctl(box,[["Changer de micro-organisme",()=>{shape=(shape+1)%SH.length;drawMic();msg.textContent="Le même phagocyte peut ingérer une "+SH[shape][0]+" : la phagocytose n'est pas spécifique.";}]]);
  const msg=live(box,"");
};

const app=$("app");const NSE=SEANCES.length;
function scoreOf(s){let f=0,t=0,d=0;s.qs.forEach(q=>{const st=S.qs[q.id];if(st&&st.tries){t++;if(st.first)f++;}if(st&&st.done)d++;});return {f,t,d};}
function started(s){return s.qs.some(q=>S.qs[q.id]&&S.qs[q.id].tries);}
function totals(){let f=0,t=0,ns=0;SEANCES.forEach(s=>{const r=scoreOf(s);f+=r.f;t+=r.t;if(r.t)ns++;});return {f,t,ns};}
const CATS=[["r6","Rappel des années précédentes"],["sp","Séance précédente"],["se","Rappel espacé"],["doc","Lire un document"]];
function catStats(){const o={};CATS.forEach(c=>o[c[0]]={f:0,t:0});SEANCES.forEach(s=>s.qs.forEach(q=>{const st=S.qs[q.id];if(st&&st.tries){o[q.tc].t++;if(st.first)o[q.tc].f++;}}));return o;}
function pct(f,t){return t?Math.round(100*f/t):0;}
function nextSeance(){let last=0;SEANCES.forEach(s=>{if(started(s))last=s.n;});if(!last)return 1;const s=SEANCES[last-1];return scoreOf(s).t<4?last:Math.min(NSE,last+1);}
function mainCtx(host){return {mode:"seance",p:"",host,apis:{},st:q=>qst(q.id),save,after:(q,E,first)=>{if(first){S.box[q.id]=E.ok?2:1;S.last[q.id]=Date.now();}
  const api=curCtx&&curCtx.apis[q.id];if(E.ok&&api)api._s.forEach(f=>{try{f();}catch(e){}});updSeance();}};}
let curCtx=null,curView="";

/* ---------- réglages ---------- */
function applyFs(){const r=document.documentElement;r.classList.toggle("proj",!!S.proj);r.style.setProperty("--fs",(S.proj?Math.max(S.fs,30):S.fs)+"px");$("proj").setAttribute("aria-pressed",S.proj?"true":"false");}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme");}
$("fsMinus").onclick=()=>{S.fs=Math.max(20,S.fs-2);applyFs();save();};
$("fsPlus").onclick=()=>{S.fs=Math.min(34,S.fs+2);applyFs();save();};
$("proj").onclick=()=>{S.proj=!S.proj;applyFs();save();};
$("theme").onclick=()=>{const dark=S.theme?S.theme==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);S.theme=dark?"light":"dark";applyTheme();save();};

/* ---------- minuteur ---------- */
const TM={left:300,run:false,last:0,iv:null};
function tDraw(){const s=Math.max(0,Math.ceil(TM.left)),c=$("tclock");c.textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2);c.className="tclock"+(s===0?" end":s<=60?" low":"");$("tPlay").textContent=TM.run?"⏸":"▶";$("tPlay").setAttribute("aria-label",TM.run?"Mettre le minuteur en pause":"Lancer le minuteur");}
function tStart(){if(TM.left<=0)TM.left=300;TM.run=true;TM.last=performance.now();clearInterval(TM.iv);TM.iv=setInterval(()=>{const n=performance.now();TM.left-=(n-TM.last)/1000;TM.last=n;if(TM.left<=0){TM.left=0;TM.run=false;clearInterval(TM.iv);$("tclock").setAttribute("aria-label","Temps écoulé : termine ta question en cours.");}tDraw();},250);tDraw();}
function tStop(){TM.run=false;clearInterval(TM.iv);tDraw();}
$("tPlay").onclick=()=>{TM.run?tStop():tStart();};
$("tReset").onclick=()=>{tStop();TM.left=300;tDraw();};

/* ---------- routage ---------- */
function go(h){if(location.hash!=="#"+h)location.hash=h;else route();}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go]");if(t){e.preventDefault();go(t.dataset.go);}});
window.addEventListener("hashchange",route);
function leave(){stopLoops();cleanup();tStop();curCtx=null;}
function route(){
  const h=(location.hash||"#home").slice(1);leave();window.scrollTo(0,0);
  $("sbar").hidden=true;
  let m;
  if((m=/^s(\d+)$/.exec(h))&&+m[1]>=1&&+m[1]<=NSE)viewSeance(+m[1]);
  else if((m=/^rev(?:-(r6|sp|se))?$/.exec(h)))viewRev(m[1]||null);
  else if(h==="prog")viewProg();
  else if(h==="bilan")viewBilan();
  else viewHome();
}

/* ---------- sommaire ---------- */
function viewHome(){
  curView="home";const T=totals(),nx=nextSeance();
  app.innerHTML='<section class="view">'+
   '<div class="card stack"><div class="hero"><div class="stack" style="gap:6px"><div class="kicker">Mon carnet d\'automatismes</div><p>'+NSE+' séances de 5 minutes pour réactiver ce que tu as appris. Le score compte ta réponse au <b>premier essai</b> ; ensuite, tu peux corriger autant que tu veux.</p></div>'+
   '<div class="field"><label for="pname">Prénom ou numéro (facultatif, reste sur cet iPad)</label><input class="name" id="pname" autocomplete="off" maxlength="40" value="'+esc(S.name)+'"></div></div>'+
   '<div class="stats"><div class="stat"><div class="k">Séances commencées</div><div class="v">'+T.ns+' / '+NSE+'</div></div><div class="stat"><div class="k">Réussies au 1er essai</div><div class="v">'+T.f+' / '+T.t+'</div></div><div class="stat"><div class="k">Taux de réussite</div><div class="v">'+(T.t?pct(T.f,T.t)+" %":"—")+'</div></div></div>'+
   '<div class="quick"><button class="btn" data-go="s'+nx+'">▶ '+(T.ns?"Reprendre : séance n°":"Commencer : séance n°")+nx+'</button><button class="btn ghost" data-go="rev">🔀 Révision mélangée</button><button class="btn ghost" data-go="prog">📈 Ma progression</button><button class="btn ghost" data-go="bilan">📄 Mon bilan</button></div></div>'+
   MISSIONS.map(mi=>'<div class="mission"><div class="mhead"><h3>'+esc(mi.name)+'</h3><span class="muted small">'+esc([...new Set(mi.ss.map(s=>s.theme).filter(Boolean))].join(" · "))+'</span></div><div class="tiles">'+mi.ss.map(s=>{const r=scoreOf(s);const b=r.t?'<span class="badge '+(r.t===4?(r.f===4?"full":"part"):"part")+'">'+r.f+'/'+(r.t===4?4:r.t)+(r.t<4?" …":"")+'</span>':'<span class="badge">à faire</span>';
     return '<button class="tile'+(s.n===nx?" cur":"")+'" data-go="s'+s.n+'" aria-label="Séance '+s.n+', '+esc(s.theme||s.mission)+', '+(r.t?r.f+" sur 4 au premier essai":"à faire")+'"><span class="tn"><span>Séance n°'+s.n+'</span>'+b+'</span><span class="tt">'+esc(s.date)+(s.theme?' · '+esc(s.theme):'')+'</span></button>';}).join("")+'</div></div>').join("")+
   '</section>';
  $("pname").addEventListener("input",e=>{S.name=e.target.value;save();});
}

/* ---------- séance ---------- */
function viewSeance(n){
  curView="s";const s=SEANCES[n-1];S.lastSn=n;save();
  $("sbar").hidden=false;$("sbTitle").textContent="Séance n°"+n;
  app.innerHTML='<section class="view"><div class="shead"><div class="kicker">'+esc(s.mission)+(s.theme?' · '+esc(s.theme):'')+'</div><h2 class="h2">Séance n°'+n+'</h2><p class="muted">'+esc(s.date)+' · 5 minutes · 4 questions</p></div><div class="stack" id="qhost" style="gap:18px"></div><div id="endSlot"></div>'+
   '<div class="snav">'+(n>1?'<button class="btn ghost" data-go="s'+(n-1)+'">← Séance n°'+(n-1)+'</button>':'<span></span>')+(n<NSE?'<button class="btn ghost" data-go="s'+(n+1)+'">Séance n°'+(n+1)+' →</button>':'')+'</div></section>';
  curCtx=mainCtx($("qhost"));
  s.qs.forEach(q=>buildCard(q,curCtx));
  updSeance();
  TM.left=300;tDraw();if(!started(s))tStart();
}
function updSeance(){
  const m=/^#s(\d+)$/.exec(location.hash||"");if(!m)return;const s=SEANCES[+m[1]-1],r=scoreOf(s);
  $("sbScore").textContent=(r.t?r.f:"–")+" / 4";
  const slot=$("endSlot");if(!slot)return;
  if(r.t<4){slot.innerHTML="";return;}
  const perfect=r.f===4;
  slot.innerHTML='<div class="endcard" aria-live="polite"><div class="kicker" style="color:var(--band-muted)">Séance terminée</div><div class="big">'+r.f+' / 4</div><p>'+(perfect?"Parfait : tout juste au premier essai !":r.f>=3?"Très bien. Relis le corrigé de la question ratée.":r.f>=2?"C'est en bonne voie : relis les corrigés et refais les questions ratées.":"Relis bien les corrigés : ces notions reviendront dans les prochaines séances.")+'</p>'+
   '<div class="row"><button class="btn" id="showProf">Montrer au professeur</button>'+(s.n<NSE?'<button class="btn ghost" data-go="s'+(s.n+1)+'">Séance suivante →</button>':'')+'<button class="btn ghost" data-go="rev">🔀 Révision mélangée</button></div></div>';
  $("showProf").onclick=()=>showProfSeance(s);
  if(perfect&&!s._cel){s._cel=1;celebrate();}
}
function showProfSeance(s){
  $("ovkick").textContent="À montrer au professeur";$("ovname").textContent=S.name.trim()||"Élève";$("ovsub").textContent="Séance n°"+s.n+" · score au premier essai";
  const r=scoreOf(s);$("ovtot").textContent=r.f+" / 4";
  $("ovlist").innerHTML=s.qs.map(q=>{const st=S.qs[q.id]||{};return '<div class="ovitem">'+q.k+'. '+(st.tries?(st.first?'<span style="color:var(--ok)">✓ juste</span>':'<span style="color:var(--bad)">✗ raté</span>'+(st.done?" puis corrigé":"")):'<span class="muted">non fait</span>')+'<div class="muted small" style="font-weight:400">'+esc(q.tl)+'</div></div>';}).join("");
  $("overlay").hidden=false;$("ovClose").focus();
}
$("ovClose").onclick=()=>{$("overlay").hidden=true;};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("overlay").hidden=true;});

/* ---------- révision mélangée ---------- */
let REV=null;
function revPool(cat){const pool=[];SEANCES.forEach(s=>{if(!started(s))return;s.qs.forEach(q=>{if(q.k===4)return;if(cat&&q.tc!==cat)return;pool.push(q);});});
  return pool.map(q=>({q,b:S.box[q.id]||((S.qs[q.id]&&S.qs[q.id].tries)?(S.qs[q.id].first?2:1):1),l:S.last[q.id]||0,r:Math.random()})).sort((a,b)=>a.b-b.b||a.l-b.l||a.r-b.r);}
function viewRev(cat){
  curView="rev";const pool=revPool(cat);const catl=cat?CATS.find(c=>c[0]===cat)[1]:null;
  if(!pool.length){app.innerHTML='<section class="view"><div class="kicker">Révision mélangée</div><h2 class="h2">Rien à réviser pour l\'instant</h2><p>Fais d\'abord quelques séances : la révision reprend les questions des séances que tu as commencées, en priorité celles que tu as ratées.</p><div class="row"><button class="btn" data-go="home">← Sommaire</button></div></section>';return;}
  const top=pool.slice(0,Math.min(pool.length,14));for(let i=top.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[top[i],top[j]]=[top[j],top[i]];}
  top.sort((a,b)=>a.b-b.b);const list=top.slice(0,8).map(x=>x.q);
  REV={list,i:0,st:{},res:[],cat};
  app.innerHTML='<section class="view"><div class="shead"><div class="kicker">Révision mélangée'+(catl?" · "+esc(catl):"")+'</div><h2 class="h2">Rappel espacé</h2><p class="muted">Questions tirées des séances déjà faites, en priorité celles que tu as ratées. Ce score ne compte pas dans tes séances.</p></div><p class="alive" id="revProg"></p><div id="revHost" class="stack"></div><div class="row" id="revNav"></div></section>';
  revShow();
}
function revShow(){
  const host=$("revHost");host.innerHTML="";stopLoops();cleanup();
  if(REV.i>=REV.list.length){const ok=REV.res.filter(Boolean).length;$("revProg").textContent="";
    host.innerHTML='<div class="endcard"><div class="kicker" style="color:var(--band-muted)">Révision terminée</div><div class="big">'+ok+' / '+REV.list.length+'</div><p>'+(ok===REV.list.length?"Tout juste du premier coup : ces notions sont bien ancrées !":"Les questions ratées reviendront en priorité lors de ta prochaine révision.")+'</p><div class="row"><button class="btn" id="revAgain">🔀 Nouvelle révision</button><button class="btn ghost" data-go="prog">📈 Ma progression</button><button class="btn ghost" data-go="home">Sommaire</button></div></div>';
    $("revNav").innerHTML="";$("revAgain").onclick=()=>viewRev(REV.cat);return;}
  const q=REV.list[REV.i];$("revProg").textContent="Question "+(REV.i+1)+" / "+REV.list.length;
  const ctx={mode:"rev",p:"r"+REV.i+"-",host,apis:{},num:REV.i+1,st:x=>REV.st[x.id]||(REV.st[x.id]={a:{},tries:0,hints:0}),save:()=>{},after:(x,E,first)=>{if(first){REV.res[REV.i]=E.ok;S.box[x.id]=E.ok?Math.min(5,(S.box[x.id]||1)+1):1;S.last[x.id]=Date.now();save();}revNav();}};
  curCtx=ctx;buildCard(q,ctx);revNav();
}
function revNav(){const done=REV.res[REV.i]!==undefined;$("revNav").innerHTML='<button class="btn" id="revNext"'+(done?"":" disabled")+'>'+(REV.i+1<REV.list.length?"Question suivante →":"Voir mon résultat →")+'</button>';$("revNext").onclick=()=>{REV.i++;revShow();window.scrollTo(0,0);};}

/* ---------- progression ---------- */
function viewProg(){
  curView="prog";const C=catStats(),T=totals();
  const weak=[];SEANCES.forEach(s=>s.qs.forEach(q=>{const st=S.qs[q.id];if(st&&st.tries&&!st.first)weak.push({q,done:!!st.done});}));
  app.innerHTML='<section class="view"><div class="shead"><div class="kicker">Ma progression</div><h2 class="h2">Réussite au premier essai, par type de question</h2></div>'+
   '<div class="card stack">'+CATS.map(c=>{const o=C[c[0]];return '<div class="pbar"><div class="pl"><span><span class="tag '+c[0]+'">'+esc(c[1])+'</span></span><span>'+(o.t?pct(o.f,o.t)+" % ("+o.f+" / "+o.t+")":"pas encore de réponse")+'</span></div><div class="track" role="img" aria-label="'+esc(c[1])+' : '+pct(o.f,o.t)+' %"><span style="width:'+pct(o.f,o.t)+'%"></span></div>'+(c[0]!=="doc"&&o.t?'<div><button class="btn ghost sm" data-go="rev-'+c[0]+'">Réviser ce type de questions</button></div>':"")+'</div>';}).join("")+'</div>'+
   (T.t?'<div class="box info"><div class="bt">ℹ︎ Mon point faible</div><p>'+esc(advice(C))+'</p></div>':'')+
   '<div class="card stack"><div class="kicker">Par mission</div>'+MISSIONS.map(mi=>{let f=0,t=0;mi.ss.forEach(s=>{const r=scoreOf(s);f+=r.f;t+=r.t;});return t?'<div class="pbar"><div class="pl"><span>'+esc(mi.name)+'</span><span>'+pct(f,t)+' % ('+f+' / '+t+')</span></div><div class="track"><span style="width:'+pct(f,t)+'%"></span></div></div>':"";}).join("")+(T.t?"":'<p class="muted">Aucune séance commencée.</p>')+'</div>'+
   '<div class="card stack"><div class="kicker">Questions ratées au premier essai ('+weak.length+')</div><div class="weak">'+(weak.length?weak.slice(-15).reverse().map(w=>'<button class="btn ghost sm" data-go="s'+w.q.sn+'">Séance n°'+w.q.sn+', question '+w.q.k+' · '+esc(w.q.text.length>70?w.q.text.slice(0,68)+"…":w.q.text)+(w.done?" · corrigée ✓":"")+'</button>').join(""):'<p class="muted">Aucune pour l\'instant.</p>')+'</div></div>'+
   '<div class="row"><button class="btn" data-go="rev">🔀 Révision mélangée</button><button class="btn ghost" data-go="bilan">📄 Mon bilan</button><button class="btn ghost" data-go="home">Sommaire</button></div></section>';
}
function advice(C){const l=CATS.filter(c=>C[c[0]].t>=2).map(c=>({c,p:C[c[0]].f/C[c[0]].t})).sort((a,b)=>a.p-b.p);if(!l.length)return "Continue les séances pour obtenir un conseil personnalisé.";const w=l[0].c[0];
  return {r6:"Les rappels des années précédentes : relis tes cahiers de 4e et de 5e ou lance une révision ciblée.",sp:"Les questions sur la séance précédente : relis le corrigé de la dernière séance avant chaque cours.",se:"Les notions plus anciennes : fais une révision mélangée chaque semaine pour ne pas les oublier.",doc:"La lecture de documents : prends le temps de lire le titre, les colonnes et les unités avant de répondre."}[w];}

/* ---------- bilan ---------- */
function today(){const d=new Date();return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear();}
function bilanText(){const T=totals(),C=catStats(),L=[];
  L.push("Automatismes 3e SVT — bilan");L.push("Élève : "+(S.name.trim()||"non renseigné")+"   Date : "+today());
  L.push("Séances commencées : "+T.ns+" / "+NSE);L.push("Réussite au premier essai : "+T.f+" / "+T.t+(T.t?" ("+pct(T.f,T.t)+" %)":""));
  L.push("Par type de question :");CATS.forEach(c=>{const o=C[c[0]];L.push("  - "+c[1]+" : "+(o.t?o.f+" / "+o.t+" ("+pct(o.f,o.t)+" %)":"—"));});
  L.push("Détail des séances :");SEANCES.forEach(s=>{const r=scoreOf(s);if(r.t)L.push("  - Séance n°"+s.n+" ("+(s.theme||s.mission)+") : "+r.f+" / "+r.t+(r.t<4?" (incomplète)":""));});
  const w=[];SEANCES.forEach(s=>s.qs.forEach(q=>{const st=S.qs[q.id];if(st&&st.tries&&!st.first)w.push("S"+s.n+"Q"+q.k);}));L.push("Questions ratées au premier essai : "+(w.length?w.join(", "):"aucune"));
  return L.join("\n");}
function viewBilan(){
  curView="bilan";const T=totals(),C=catStats();
  app.innerHTML='<section class="view"><div class="shead"><div class="kicker">Mon bilan</div><h2 class="h2">Tout mon carnet d\'automatismes</h2></div><div class="card stack">'+
   '<div class="field"><label for="pname">Prénom ou numéro (facultatif, reste sur cet iPad)</label><input class="name" id="pname" autocomplete="off" maxlength="40" value="'+esc(S.name)+'"></div>'+
   '<div class="stats"><div class="stat"><div class="k">Séances</div><div class="v">'+T.ns+' / '+NSE+'</div></div><div class="stat"><div class="k">1er essai</div><div class="v">'+T.f+' / '+T.t+'</div></div><div class="stat"><div class="k">Réussite</div><div class="v">'+(T.t?pct(T.f,T.t)+" %":"—")+'</div></div></div>'+
   '<div class="bilantext" id="bilanText"></div><div class="row"><button class="btn" id="bProf">Montrer au professeur</button><button class="btn ghost" id="dlB" hidden>Télécharger mon bilan (.txt)</button><button class="btn ghost" id="cpB">Copier mon bilan</button></div><p class="muted" id="bMsg" aria-live="polite"></p></div>'+
   '<div class="row"><button class="btn ghost" data-go="prog">📈 Ma progression</button><button class="btn ghost" data-go="home">Sommaire</button></div></section>';
  $("bilanText").textContent=bilanText();
  $("pname").addEventListener("input",e=>{S.name=e.target.value;save();$("bilanText").textContent=bilanText();});
  $("cpB").onclick=()=>{const t=bilanText(),msg=$("bMsg");const sel=()=>{const r=document.createRange();r.selectNodeContents($("bilanText"));const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="Le texte est sélectionné : copie-le avec ton iPad.";};try{navigator.clipboard.writeText(t).then(()=>{msg.textContent="Bilan copié.";},sel);}catch(e){sel();}};
  if(DL)$("dlB").hidden=false;
  $("dlB").onclick=()=>{if(!DL)return;const msg=$("bMsg"),nm=(S.name.trim()||"eleve").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_-]+/g,"-").slice(0,30)||"eleve";
    DL.save({filename:"automatismes-"+nm+".txt",data:bilanText()}).then(()=>{msg.textContent="Bilan téléchargé.";},err=>{const c=err&&err.code;msg.textContent=c==="declined"?"Téléchargement annulé.":c==="rate_limited"?"Patiente un instant, puis réessaie.":"Téléchargement impossible ici : utilise « Copier mon bilan ».";});};
  $("bProf").onclick=()=>{$("ovkick").textContent="Bilan à montrer au professeur";$("ovname").textContent=S.name.trim()||"Élève";$("ovsub").textContent=T.ns+" séances commencées · réussite au premier essai";$("ovtot").textContent=T.t?pct(T.f,T.t)+" %":"—";
    $("ovlist").innerHTML=CATS.map(c=>{const o=C[c[0]];return '<div class="ovitem">'+esc(c[1])+'<div style="font-family:var(--f-num)">'+(o.t?o.f+" / "+o.t:"—")+'</div></div>';}).join("");$("overlay").hidden=false;$("ovClose").focus();};
}
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(d=>{DL=d;const b=$("dlB");if(b&&d)b.hidden=false;}).catch(()=>{});}catch(e){}

/* ---------- confettis ---------- */
function celebrate(){if(RM)return;const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);const w=innerWidth,h=innerHeight,dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";const c=cv.getContext("2d");c.scale(dpr,dpr);
  const cols=["--teal","--ok","--warn","--info","--sun"].map(css);const P=[];for(let i=0;i<140;i++)P.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*3,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[i%cols.length]});
  let t0=null;const f=ts=>{if(t0===null)t0=ts;const el=ts-t0;c.clearRect(0,0,w,h);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=Math.max(0,1-el/2200);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();});if(el<2200)requestAnimationFrame(f);else cv.remove();};requestAnimationFrame(f);}

applyFs();applyTheme();route();
window.__t={S:()=>S,SEANCES,evalQ,QBY,go};

})();
</script>
<footer data-signature style="text-align:center;font-size:.8rem;opacity:.75;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">Mr Moreira · Vauban Luxembourg</footer>
