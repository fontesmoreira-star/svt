}

  --ok:#8fe0a7; --ok-bg:#12301f; --ko:#ffa597; --ko-bg:#3b1815; --focus:#ffb066; --data-bg:#1a2742;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-contrast="high"]{

/* En-tête matière */
.band{height:12px;background:var(--pc-band)}
header.top{background:var(--pc-tint);border-bottom:var(--bw) solid var(--pc)}
header.top .wrap{padding-block:.6rem .7rem;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
.subject{min-width:0}
.subject b{display:block;color:var(--pc);font-size:1.15rem;letter-spacing:.06em;line-height:1.2}

.tools{display:flex;flex-wrap:wrap;gap:.4rem}
.tool{min-height:48px;min-width:48px;padding:.2rem .6rem;font:inherit;font-size:.75rem;font-weight:bold;color:var(--pc);background:var(--surface);border:var(--bw) solid var(--pc);border-radius:10px;cursor:pointer}

h1,h2{line-height:1.25;text-wrap:balance;margin:0}

p{margin:0}

.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:14px;padding:1rem}

.list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:.3rem}

.btn{min-height:56px;font:inherit;font-weight:bold;padding:.4rem 1.1rem;border-radius:12px;cursor:pointer;border:4px solid var(--pc);background:var(--pc-tint);color:var(--ink);text-align:center}
.btn.ghost{background:var(--surface);color:var(--pc);border-width:var(--bw)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.7rem}
.row .btn{flex:1 1 12rem}

/* Progression */
.progress{display:flex;flex-direction:column;gap:.35rem}
.progress .lab{font-size:.8rem;font-weight:bold;color:var(--muted)}
.bar{height:14px;border:2px solid var(--pc);border-radius:8px;overflow:hidden;background:var(--surface)}
.bar i{display:block;height:100%;background:var(--pc-band)}

.stem{font-size:1.05rem}
.data{background:var(--data-bg);border:var(--bw) dashed var(--pc);border-radius:12px;padding:.7rem .9rem}

.opt .L{grid-row:1 / span 2;width:2em;height:2em;display:grid;place-items:center;border:var(--bw) solid var(--pc);border-radius:8px;font-weight:bold;color:var(--pc)}
.opt .txt{min-width:0;overflow-wrap:normal}
.opt .mark{grid-column:2;font-size:.85rem;font-weight:bold}
.opt[aria-pressed="true"]{border-width:4px;border-color:var(--pc);background:var(--pc-tint)}
.opt[aria-pressed="true"] .L{border-width:4px;text-decoration:underline}
.opt.good{border:4px solid var(--ok);background:var(--ok-bg)}
.opt.bad{border:4px solid var(--ko);background:var(--ko-bg)}
.opt.good .mark{color:var(--ok)} .opt.bad .mark{color:var(--ko)}

.idk{align-self:flex-start;min-height:48px;font:inherit;font-size:.85rem;padding:.3rem .8rem;border-radius:10px;border:2px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}

.fb{border-radius:12px;padding:.8rem 1rem;border:var(--bw) solid}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.ko{border-color:var(--ko);background:var(--ko-bg)}

.fb.ok .v{color:var(--ok)} .fb.ko .v{color:var(--ko)}

/* Notation du noyau A en haut, Z en bas */
.nuc{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}
.nuc .s{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.7em;line-height:1.05;margin-right:.06em}

.total{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}

.parts{display:grid;gap:.7rem}
.prt{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:center;border:var(--bw) solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--surface)}
.prt .n{min-width:0;font-weight:bold}
.prt .sc{font-weight:bold;font-variant-numeric:tabular-nums;color:var(--pc)}

.dots{letter-spacing:.12em;font-size:.95rem}
.report{white-space:pre-wrap;font-family:var(--font);font-size:.8rem;line-height:1.45;background:var(--data-bg);border:2px solid var(--line);border-radius:12px;padding:.8rem;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere;margin:0}

<script>
/* Hébergement classique (GitHub Pages) : le bilan se télécharge comme un fichier .txt */
(function(){
  if(window.claude) return;
  function save(o){
    return new Promise(function(res,rej){
      try{
        var txt=(o&&o.data!=null)?String(o.data):"";
        var blob=new Blob(["\ufeff"+txt],{type:"text/plain;charset=utf-8"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=(o&&o.filename)||"bilan.txt"; a.style.display="none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(url); a.remove();},15000);
        res();
      }catch(e){ rej({code:"failed"}); }
    });
  }
  window.claude={use:function(name){
    return name==="downloads" ? Promise.resolve({save:save}) : Promise.reject(new Error("indisponible"));
  }};
})();
</script>

 document.getElementById("hc").setAttribute("aria-pressed",ui.hc?"true":"false");
 document.getElementById("theme").textContent="Thème : "+({auto:"auto",light:"clair",dark:"sombre"})[ui.theme];}
document.getElementById("fsMinus").onclick=()=>{ui.fs=Math.max(18,ui.fs-2);applyUI();save();};
document.getElementById("fsPlus").onclick=()=>{ui.fs=Math.min(40,ui.fs+2);applyUI();save();};
document.getElementById("hc").onclick=()=>{ui.hc=!ui.hc;applyUI();save();};
document.getElementById("theme").onclick=()=>{ui.theme=({auto:"light",light:"dark",dark:"auto"})[ui.theme];applyUI();save();};

const app=document.getElementById("app");
const LET=["A","B","C"];
let svgEl=null,cur=null;
function setView(html){clearPending();app.innerHTML=html;window.scrollTo(0,0);const h=app.querySelector("h1,h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}}
function tabsHtml(){return `<nav class="tabs" aria-label="Les 4 scènes">${SC.map((s,i)=>`<button class="tab" type="button" data-go="${i}" aria-current="${!st.end&&st.s===i?"true":"false"}">${st.ans[i]?(st.ans[i].ok?"✓ ":"✗ "):""}${s.title.replace(" · ","<br>")}</button>`).join("")}</nav>`;}

function renderStart(){
 const resume=st.started&&!st.end;
 setView(`<h1>La compétition ionique</h1>
 <div class="card"><div style="display:flex;flex-direction:column;gap:.6rem">
  <p>Pourquoi les atomes deviennent-ils des <b>ions</b> ? Découvre-le en <b>4 scènes animées</b>. Tu avances <b>à ton rythme</b> avec le bouton « Étape suivante ».</p>
  <ul class="list"><li>Tu peux revenir en arrière ou rejouer une étape.</li><li>À la fin de chaque scène : une question « À toi ! ».</li><li>Durée : 12 minutes environ.</li></ul>
 </div></div>
 <div class="card"><div style="display:flex;flex-direction:column;gap:.5rem"><span class="kicker">Les 4 scènes</span>
  <ol class="list">${SC.map(s=>`<li><b>${s.title.split(" · ")[1]}</b></li>`).join("")}</ol></div></div>
 <div class="row"><button class="btn" id="go" type="button">${resume?"Reprendre":"Commencer"}</button></div>`);
 document.getElementById("go").onclick=()=>{if(!st.started){st.started=true;st.t0=Date.now();}save();route();};
}

function renderScene(animate){
 const i=st.s,S=SC[i],K=S.caps.length,k=Math.min(st.k,K-1),last=k===K-1,a=st.ans[i];
 setView(`${tabsHtml()}
 <span class="kicker">Scène ${i+1} sur 4</span>
 <h1>${S.title.split(" · ")[1]}</h1>
 <div class="stage"><svg id="svg" viewBox="${S.vb}" role="img" aria-label="${S.title}"></svg></div>
 <div class="stepinfo"><span>Étape ${k+1} sur ${K}</span><span class="pips" aria-hidden="true">${S.caps.map((c,j)=>`<i class="${j<=k?"on":""}"></i>`).join("")}</span></div>
 <div class="cap" id="cap" aria-live="polite">${S.caps[k]}</div>
 <div class="ctrls">
  <button class="btn ghost" id="prev" type="button" ${k===0?"disabled":""}>◀ Retour</button>
  ${last?`<button class="btn" id="toq" type="button">${a?"Voir la question":"À toi ! ▼"}</button>`:`<button class="btn" id="next" type="button">Étape suivante ▶</button>`}
 </div>
 <button class="replay" id="replay" type="button">↺ Rejouer l'étape</button>
 ${last?qHtml(i):""}`);
 svgEl=document.getElementById("svg");cur=S;S.build(svgEl);
 instant=true;svgEl.classList.add("instant");
 if(animate&&k>0){S.render(k-1);}else S.render(k);
 svgEl.getBoundingClientRect();svgEl.classList.remove("instant");instant=false;
 if(animate&&!RM){requestAnimationFrame(()=>requestAnimationFrame(()=>{S.render(k);}));}
 else if(animate&&RM){instant=true;S.render(k);instant=false;}
 const nx=document.getElementById("next");if(nx)nx.onclick=()=>{st.k=k+1;save();renderScene(true);};
 document.getElementById("prev").onclick=()=>{st.k=Math.max(0,k-1);save();renderScene(false);};
 document.getElementById("replay").onclick=()=>renderScene(true);
 const tq=document.getElementById("toq");if(tq)tq.onclick=()=>{const q=document.getElementById("qcard");if(q)q.scrollIntoView({block:"start",behavior:RM?"auto":"smooth"});};
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{st.s=+b.dataset.go;st.k=0;st.end=false;save();renderScene(false);});
 bindQ(i);
}
function qHtml(i){const q=SC[i].q,a=st.ans[i];
 const opts=q.opts.map((o,j)=>{let cls="opt",mark="";if(a){if(j===q.a){cls+=" good";mark="✓ Bonne réponse";}else if(j===a.c){cls+=" bad";mark="✗ Ta réponse";}}
  return `<li><button class="${cls}" type="button" data-q="${j}" ${a?"disabled":""}><span class="L" aria-hidden="true">${LET[j]}</span><span class="txt">${o}</span>${mark?`<span class="mark">${mark}</span>`:""}</button></li>`;}).join("");
 const fb=a?`<div class="fb ${a.ok?"ok":"ko"}" role="status"><div class="v">${a.ok?"✓ Bravo, c'est juste !":"✗ Pas tout à fait. La bonne réponse est "+LET[q.a]+"."}</div><div class="why">${q.why}</div></div>`:"";
 const nextLbl=i<SC.length-1?"Scène suivante →":"Voir mon bilan";
 return `<section class="qcard" id="qcard"><span class="kicker">À toi !</span><p class="stem">${q.stem}</p><ul class="opts">${opts}</ul>${fb}
  ${a?`<div class="row"><button class="btn" id="nextS" type="button">${nextLbl}</button></div>`:""}</section>`;}
function bindQ(i){
 app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const c=+b.dataset.q;st.ans[i]={c:c,ok:c===SC[i].q.a};save();
  const qc=document.getElementById("qcard");qc.outerHTML=qHtml(i);bindQ(i);
  const t=app.querySelector(`.tab[data-go="${i}"]`);if(t)t.innerHTML=(st.ans[i].ok?"✓ ":"✗ ")+SC[i].title.replace(" · ","<br>");
  const f=document.querySelector("#qcard .fb");if(f)f.scrollIntoView({block:"nearest"});});
 const n=document.getElementById("nextS");
 if(n)n.onclick=()=>{if(i<SC.length-1){st.s=i+1;st.k=0;save();renderScene(false);}else{st.end=true;st.t1=st.t1||Date.now();save();route();}};
}

/* ---------- bilan ---------- */
function fmtDate(t){const d=new Date(t),z=n=>String(n).padStart(2,"0");return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} à ${z(d.getHours())}h${z(d.getMinutes())}`;}
function plain(h){const d=document.createElement("div");d.innerHTML=h.replace(/<sup>(.*?)<\/sup>/g,(m,x)=>x.split("").map(c=>({"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","−":"⁻"}[c]||c)).join("")).replace(/<sub>(.*?)<\/sub>/g,(m,x)=>x.split("").map(c=>({"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉"}[c]||c)).join(""));return d.textContent.replace(/\s+/g," ").trim();}
function bilan(){const ok=SC.filter((s,i)=>st.ans[i]&&st.ans[i].ok).length;
 const L=["SÉANCE 3 — PHYSIQUE-CHIMIE 2nde","La compétition ionique : vers des entités plus stables","Élève : (écris ton prénom)","Fait le "+fmtDate(st.t1||Date.now())+(st.t0&&st.t1?" · durée : "+Math.max(1,Math.round((st.t1-st.t0)/60000))+" min":""),"","QUESTIONS « À TOI » : "+ok+"/4"];
 SC.forEach((s,i)=>{const a=st.ans[i];L.push(s.title+" : "+(!a?"pas de réponse":(a.ok?"✓ "+LET[a.c]:"✗ "+LET[a.c]+" (attendu "+LET[s.q.a]+" : "+plain(s.q.opts[s.q.a])+")")));});
 const miss=SC.filter((s,i)=>!(st.ans[i]&&st.ans[i].ok));
 L.push("","À REVOIR");if(!miss.length)L.push("- Rien : tout est juste !");miss.forEach(s=>L.push("- "+s.title+" : rejoue la scène"));
 L.push("","CONSEIL",miss.length?"Rejoue la scène ratée, puis réessaie la question.":"Bravo ! Tu sais pourquoi et comment les atomes deviennent des ions.");
 return {txt:L.join("\n"),ok};}
let dl=null;
function renderEnd(){const b=bilan(),txt=b.txt,esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
 const wa="https://wa.me/?text="+encodeURIComponent(txt);
 const gm="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(MAIL)+"&su="+encodeURIComponent("Bilan séance 3 PC – compétition ionique")+"&body="+encodeURIComponent(txt);
 setView(`${tabsHtml()}<span class="kicker">Bilan</span><h1>Bravo, tu as terminé la compétition !</h1>
 <div class="card"><div class="total"><b>${b.ok}/4</b><span>questions réussies</span></div></div>
 <div class="parts">${SC.map((s,i)=>{const a=st.ans[i];return `<div class="prt"><span class="n">${s.title}</span><span class="sc">${!a?"—":(a.ok?"✓":"✗")}</span><span class="st"><b>${!a?"pas encore faite":(a.ok?"réussie":"à rejouer")}</b></span></div>`;}).join("")}</div>
 <h2>Envoie ton bilan à Mr Moreira</h2>
 <div class="row"><button class="btn" id="dl" type="button" hidden>Télécharger mon bilan</button><button class="btn" id="cp" type="button">Copier mon bilan</button>
  <a class="btn ghost" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Envoyer par WhatsApp</a>
  <a class="btn ghost" href="${gm}" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Envoyer par Gmail</a></div>
 <p class="status" id="msg" role="status" aria-live="polite"></p>
 <p>Adresse de Mr Moreira :<br><span class="mail">${MAIL}</span></p>
 <pre class="report" id="rep">${esc(txt)}</pre>
 <details><summary>Tout recommencer</summary><div class="inner"><p>Tes réponses seront effacées.</p><div class="row"><button class="btn ghost" id="rs" type="button">Oui, recommencer</button></div></div></details>`);
 const msg=document.getElementById("msg");
 document.getElementById("cp").onclick=()=>{const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("rep"));const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="Le texte est sélectionné : appuie sur « Copier ».";};
  try{navigator.clipboard.writeText(txt).then(()=>msg.textContent="✓ Bilan copié. Colle-le dans un message.",fb);}catch(e){fb();}};
 const d=document.getElementById("dl");if(dl)d.hidden=false;
 d.onclick=async()=>{if(!dl)return;try{await dl.save({filename:"bilan-seance3-competition-ionique.txt",data:txt});msg.textContent="✓ Bilan téléchargé.";}catch(e){const c=e&&e.code;msg.textContent=c==="declined"?"Téléchargement annulé.":"Le téléchargement ne marche pas ici : utilise « Copier » ou WhatsApp.";}};
 app.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{st.s=+x.dataset.go;st.k=0;st.end=false;save();renderScene(false);});
 document.getElementById("rs").onclick=()=>{st=fresh();save();route();};
}
function route(){if(!st.started)return renderStart();if(st.end)return renderEnd();renderScene(false);}

/* rotation des électrons (réflexe 1) */
let lastT=null;
function loop(t){if(lastT!==null&&cur&&cur.tick&&!RM&&document.visibilityState!=="hidden"&&svgEl&&svgEl.isConnected)cur.tick(Math.min(60,t-lastT));lastT=t;requestAnimationFrame(loop);}
requestAnimationFrame(loop);

applyUI();route();
try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(d=>{dl=d;const b=document.getElementById("dl");if(b&&dl)b.hidden=false;}).catch(()=>{});}catch(e){}
})();
</script>
<footer data-signature style="text-align:center;font-size:.8rem;opacity:.75;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">Mr Moreira · Vauban Luxembourg</footer>
</body>
</html>
