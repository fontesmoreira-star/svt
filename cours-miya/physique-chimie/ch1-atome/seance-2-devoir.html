.tools{display:flex;flex-wrap:wrap;gap:.4rem}
.tool{min-height:48px;min-width:48px;padding:.2rem .6rem;font:inherit;font-size:.75rem;font-weight:bold;color:var(--pc);background:var(--surface);border:var(--bw) solid var(--pc);border-radius:10px;cursor:pointer}

main .wrap{padding-block:1.2rem 3rem;display:flex;flex-direction:column;gap:1rem}

.btn{min-height:56px;font:inherit;font-weight:bold;padding:.4rem 1.1rem;border-radius:12px;cursor:pointer;border:4px solid var(--pc);background:var(--pc-tint);color:var(--ink);text-align:center}
.btn.ghost{background:var(--surface);color:var(--pc);border-width:var(--bw)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.7rem}
.row .btn{flex:1 1 12rem}

/* Progression */
.progress{display:flex;flex-direction:column;gap:.35rem}
.progress .lab{font-size:.8rem;font-weight:bold;color:var(--muted)}

.stem{font-size:1.05rem}

.opt .L{grid-row:1 / span 2;width:2em;height:2em;display:grid;place-items:center;border:var(--bw) solid var(--pc);border-radius:8px;font-weight:bold;color:var(--pc)}
.opt .txt{min-width:0;overflow-wrap:normal}
.opt .mark{grid-column:2;font-size:.85rem;font-weight:bold}
.opt[aria-pressed="true"]{border-width:4px;border-color:var(--pc);background:var(--pc-tint)}
.opt[aria-pressed="true"] .L{border-width:4px;text-decoration:underline}
.opt.good{border:4px solid var(--ok);background:var(--ok-bg)}
.opt.bad{border:4px solid var(--ko);background:var(--ko-bg)}
.opt.good .mark{color:var(--ok)} .opt.bad .mark{color:var(--ko)}
.opt:disabled{cursor:default;opacity:1}
.idk{align-self:flex-start;min-height:48px;font:inherit;font-size:.85rem;padding:.3rem .8rem;border-radius:10px;border:2px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}

.fb{border-radius:12px;padding:.8rem 1rem;border:var(--bw) solid}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.ko{border-color:var(--ko);background:var(--ko-bg)}
.fb .v{font-weight:bold;font-size:1.1rem}
.fb.ok .v{color:var(--ok)} .fb.ko .v{color:var(--ko)}
.fb .why{margin-top:.4rem}
.step{display:block;margin-top:.25rem}

/* Notation du noyau A en haut, Z en bas */
.nuc{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}
.nuc .s{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.7em;line-height:1.05;margin-right:.06em}
sub,sup{font-size:.68em;line-height:0}

/* Bilan */
.total{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.total b{font-size:2.2rem;color:var(--pc);font-variant-numeric:tabular-nums}
.parts{display:grid;gap:.7rem}
.prt{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:center;border:var(--bw) solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--surface)}
.prt .n{min-width:0;font-weight:bold}
.prt .sc{font-weight:bold;font-variant-numeric:tabular-nums;color:var(--pc)}
.prt .st{grid-column:1 / -1;font-size:.85rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.dots{letter-spacing:.12em;font-size:.95rem}
.report{white-space:pre-wrap;font-family:var(--font);font-size:.8rem;line-height:1.45;background:var(--data-bg);border:2px solid var(--line);border-radius:12px;padding:.8rem;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere;margin:0}

.rev{border-top:2px solid var(--line);padding-top:.7rem}
.rev .h{font-weight:bold}
.small{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
<script>
/* Hébergement classique (GitHub Pages) : le bilan se télécharge comme un fichier .txt */
(function(){
  if(window.claude) return;
  function save(o){
    return new Promise(function(res,rej){
      try{
        var txt=(o&&o.data!=null)?String(o.data):"";
        var blob=new Blob(["\ufeff"+txt],{type:"text/plain;charset=utf-8"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=(o&&o.filename)||"bilan.txt"; a.style.display="none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(url); a.remove();},15000);
        res();
      }catch(e){ rej({code:"failed"}); }
    });
  }
  window.claude={use:function(name){
    return name==="downloads" ? Promise.resolve({save:save}) : Promise.reject(new Error("indisponible"));
  }};
})();
</script>

/* ---------- outils texte ---------- */
const SUPM={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","−":"⁻","-":"⁻","e":"ᵉ"};
const SUBM={"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","+":"₊","−":"₋"};
const sup=t=>String(t).split("").map(c=>SUPM[c]||c).join("");
const sub=t=>String(t).split("").map(c=>SUBM[c]||c).join("");
function uni(h){
  h=String(h).replace(/<span class="nuc"[^>]*aria-label="([A-Za-z]+), A = (\d+), Z = (\d+)">.*?<span aria-hidden="true">[A-Za-z]+<\/span><\/span>/g,(m,X,A,Z)=>sup(A)+sub(Z)+X);
  h=h.replace(/<sup>(.*?)<\/sup>/g,(m,t)=>sup(t)).replace(/<sub>(.*?)<\/sub>/g,(m,t)=>sub(t));
  const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();
}
const fmt=x=>String(+x.toPrecision(6)).replace(".",",").replace("-","−");
function parseNum(s){
  if(s===undefined||s===null)return NaN;
  s=String(s).replace(/\s/g,"").replace(/,/g,".").replace(/[−–]/g,"-");
  if(s===""||!/^[-+]?\d*\.?\d+$/.test(s))return NaN;
  return Number(s);
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function inputHtml(x,ei,si,s,r){
  const dis=r.done?"disabled":"";
  const v=r.val||{};
  const id=`i${ei}-${si}`;
  if(s.kind==="choice"){
    return `<ul class="opts">${s.opts.map((o,k)=>{
      let cls="opt",mark="";
      const sel=v.c===k;
      if(r.done){if(k===s.a){cls+=" good";mark="✓ Bonne réponse";}else if(r.last&&r.last.c===k&&!r.last.ok){cls+=" bad";mark="✗ Ta réponse";}}
      else if(r.last&&r.last.c===k&&!r.last.ok){cls+=" bad";mark="✗ Pas cette réponse";}
      else if(sel)mark="◉ Choisie";
      return `<li><button class="${cls}" type="button" data-act="pick" data-k="${k}" aria-pressed="${sel?"true":"false"}" ${dis}><span class="L" aria-hidden="true">${LET[k]}</span><span class="txt">${o}</span>${mark?`<span class="mark">${mark}</span>`:""}</button></li>`;}).join("")}</ul>`;
  }
  if(s.kind==="classify"){
    const picks=v.p||[];const lc=r.last&&r.last.items;
    return `<div class="cls">${s.items.map((it,j)=>{
      let res="";
      if(r.done)res=`<span class="res ok">✓ ${esc(s.opts[it.a])}</span>`;
      else if(lc&&lc[j]!==undefined)res=lc[j]?`<span class="res ok">✓ juste</span>`:`<span class="res ko">✗ à changer</span>`;
      return `<div class="clsrow"><div class="it"><span>${it.t}</span>${res}</div><div class="chips" role="group" aria-label="${esc(uni(it.t))}">${s.opts.map((o,k)=>`<button class="chip" type="button" data-act="cls" data-j="${j}" data-k="${k}" aria-pressed="${picks[j]===k?"true":"false"}" ${dis}>${o}</button>`).join("")}</div></div>`;}).join("")}</div>`;
  }
  if(s.kind==="int"||s.kind==="num"){
    return `<div class="field"><input id="${id}" data-f="v" type="text" inputmode="decimal" autocomplete="off" value="${esc(v.v||"")}" ${dis} aria-label="Ta réponse">${s.unit?`<span class="unit">${s.unit}</span>`:""}</div>`;
  }
  if(s.kind==="sci"){
    return `<div class="field"><input id="${id}m" data-f="m" type="text" inputmode="decimal" autocomplete="off" value="${esc(v.m||"")}" ${dis} aria-label="Nombre devant la puissance de 10"><span class="pw"><span class="ten">× 10</span><input id="${id}e" class="e" data-f="e" type="text" inputmode="text" autocomplete="off" value="${esc(v.e||"")}" ${dis} aria-label="Exposant de 10" style="margin-top:-.3rem"><button class="sign" type="button" data-act="sign" ${dis} aria-label="Changer le signe de l'exposant">±</button></span>${s.unit?`<span class="unit">${s.unit}</span>`:""}</div><p class="small">Le nombre de gauche entre 1 et 10, puis l'exposant (le bouton ± ajoute ou enlève le signe −).</p>`;
  }
  if(s.kind==="rel"){
    return `<div class="field"><span class="pw"><span class="ten">=</span><input id="${id}e" class="e" data-f="e" type="text" inputmode="text" autocomplete="off" value="${esc(v.e||"")}" ${dis} aria-label="Ta réponse (nombre entier, positif ou négatif)" style="margin-top:-.3rem;width:4.2em"><button class="sign" type="button" data-act="sign" ${dis} aria-label="Changer le signe">±</button></span></div><p class="small">Le bouton ± ajoute ou enlève le signe −.</p>`;
  }
  if(s.kind==="exp"){
    return `<div class="field"><span class="pw"><span class="ten">= 10</span><input id="${id}e" class="e" data-f="e" type="text" inputmode="text" autocomplete="off" value="${esc(v.e||"")}" ${dis} aria-label="Exposant de 10" style="margin-top:-.3rem"><button class="sign" type="button" data-act="sign" ${dis} aria-label="Changer le signe de l'exposant">±</button></span></div>`;
  }
  return "";
}
function expected(s){
  if(s.kind==="choice")return LET[s.a]+" ("+uni(s.opts[s.a])+")";
  if(s.kind==="classify")return s.items.map(it=>uni(it.t)+" → "+s.opts[it.a]).join(" ; ");
  if(s.kind==="int"||s.kind==="num")return fmt(s.a)+(s.unit?" "+s.unit:"");
  if(s.kind==="sci")return fmt(s.m)+" × 10"+sup(String(s.e).replace("-","−"))+(s.unit?" "+s.unit:"");
  if(s.kind==="exp")return "10"+sup(String(s.e).replace("-","−"));
  if(s.kind==="rel")return fmt(s.a);
  return "";
}
function stepHtml(x,ei,si,isCur){
  const s=x.steps[si],r=R(ei,si),n=x.steps.length;
  const hintsHtml=r.hints?`<ul class="hints">${s.hints.slice(0,r.hints).map((h,k)=>`<li><b>Indice ${k+1} :</b> ${h}</li>`).join("")}</ul>`:"";
  let fb="";
  if(r.done){
    if(r.first===true)fb=`<div class="fb ok" role="status"><div class="v">✓ Juste du premier coup !</div><div class="why">${s.fix}</div></div>`;
    else if(r.shown)fb=`<div class="fix" role="status"><div class="v">Correction</div><div class="why">${s.fix}</div></div>`;
    else fb=`<div class="fb ok" role="status"><div class="v">✓ Juste ! (après un nouvel essai)</div><div class="why">${s.fix}</div></div>`;
  }else if(r.msg){
    fb=`<div class="${r.msgType==="err"?"err":"fb ko"}" role="status">${r.msgType==="err"?r.msg:`<div class="v">${r.msg}</div>`}</div>`;
  }
  const acts=r.done?"":`<div class="acts">
    <button class="btn" type="button" data-act="check">Vérifier</button>
    <button class="btn ghost" type="button" data-act="hint" ${r.hints>=3?"disabled":""}>${r.hints>=3?"Plus d'indice":"Indice "+(r.hints+1)+" sur 3"}</button>
    ${r.tries>0?`<button class="btn ghost" type="button" data-act="showfix">Voir la correction</button>`:""}
  </div>`;
  return `<section class="stepcard${isCur&&!r.done?" cur":""}" data-e="${ei}" data-s="${si}" id="sc${si}">
    ${n>1?`<span class="sl">Question ${si+1} sur ${n}</span>`:""}
    <p class="stem">${s.q}</p>
    ${inputHtml(x,ei,si,s,r)}
    ${hintsHtml}${fb}${acts}</section>`;
}
function curStep(ei){const x=EX[ei];for(let i=0;i<x.steps.length;i++){if(!R(ei,i).done)return i;}return x.steps.length;}
function renderEx(keep){
  const ei=st.e,x=EX[ei],p=PARTS[x.p-1],cs=curStep(ei),all=cs>=x.steps.length;
  let steps="";for(let i=0;i<=Math.min(cs,x.steps.length-1);i++)steps+=stepHtml(x,ei,i,i===cs);
  const last=ei===EX.length-1;
  show(`${progress()}
   <span class="kicker">${p.title}</span>
   <div><span class="lvl">${LV[x.lvl]}</span></div>
   <h2>Ex. ${ei+1} · ${x.title}</h2>
   ${x.doc?`<div class="data"><div class="t">Données</div><div>${x.doc}</div></div>`:""}
   ${steps}
   ${all?`<div class="row"><button class="btn" type="button" data-act="nextex">${last?"Voir mon bilan":"Exercice suivant →"}</button></div>`:""}`,keep);
}

/* ---------- interactions ---------- */
app.addEventListener("input",ev=>{
  const t=ev.target;if(!t.dataset||!t.dataset.f)return;
  const card=t.closest(".stepcard");if(!card)return;
  const r=R(+card.dataset.e,+card.dataset.s);r.val=r.val||{};r.val[t.dataset.f]=t.value;
  if(r.msgType==="err"){r.msg="";r.msgType="";}
  save();
});
app.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="nextex")return nextEx();
  const card=b.closest(".stepcard");if(!card)return;
  const ei=+card.dataset.e,si=+card.dataset.s,s=EX[ei].steps[si],r=R(ei,si);
  r.val=r.val||{};
  if(act==="pick"){r.val.c=+b.dataset.k;r.msg="";save();renderEx(true);return;}
  if(act==="cls"){r.val.p=r.val.p||[];r.val.p[+b.dataset.j]=+b.dataset.k;r.msg="";save();renderEx(true);return;}
  if(act==="sign"){let e=String(r.val.e||"").trim().replace(/[−–]/g,"-");e=e.startsWith("-")?e.slice(1):"-"+e;r.val.e=e.replace("-","−");save();renderEx(true);focusIn(si,"e");return;}
  if(act==="hint"){if(r.hints<3)r.hints++;save();renderEx(true);return;}
  if(act==="showfix"){r.done=true;r.shown=true;save();renderEx(true);scrollToStep(si+1);return;}
  if(act==="check"){check(ei,si,s,r);save();renderEx(true);if(r.done)scrollToStep(si+1);else scrollToStep(si);return;}
});
function focusIn(si,f){const c=document.getElementById("sc"+si);if(!c)return;const i=c.querySelector(`[data-f="${f}"]`);if(i)i.focus();}
function scrollToStep(si){const c=document.getElementById("sc"+si)||app.querySelector(".stepcard.cur")||app.querySelector("[data-act=nextex]");if(c)c.scrollIntoView({block:"nearest"});else{const n=app.querySelector("[data-act=nextex]");if(n)n.scrollIntoView({block:"nearest"});}}

function check(ei,si,s,r){
  const v=r.val||{};let ok=false,pts=0,ans="";
  r.msgType="";
  if(s.kind==="choice"){
    if(v.c===undefined||v.c===null){r.msg="Choisis d'abord une réponse.";r.msgType="err";return;}
    ok=v.c===s.a;pts=ok?1:0;ans=LET[v.c]+" ("+uni(s.opts[v.c])+")";r.last={c:v.c,ok};
  }else if(s.kind==="classify"){
    const pk=v.p||[];
    if(s.items.some((it,j)=>pk[j]===undefined||pk[j]===null)){r.msg="Choisis une réponse pour chaque ligne.";r.msgType="err";return;}
    const res=s.items.map((it,j)=>pk[j]===it.a);pts=res.filter(Boolean).length;ok=pts===s.items.length;
    ans=s.items.map((it,j)=>res[j]?null:uni(it.t)+" → "+s.opts[pk[j]]).filter(Boolean).join(" ; ");
    r.last={items:res};
    if(r.first===null)r.firstExp=s.items.map((it,j)=>res[j]?null:uni(it.t)+" → "+s.opts[it.a]).filter(Boolean).join(" ; ");
  }else if(s.kind==="int"||s.kind==="num"){
    const x=parseNum(v.v);
    if(isNaN(x)){r.msg="Écris un nombre (avec une virgule si besoin, par exemple 2,5).";r.msgType="err";return;}
    ok=s.kind==="int"?x===s.a:Math.abs(x-s.a)<=Math.max(1e-9,Math.abs(s.a)*(s.tol||0.02));pts=ok?1:0;ans=fmt(x)+(s.unit?" "+s.unit:"");
  }else if(s.kind==="sci"){
    const m=parseNum(v.m),e=parseNum(v.e);
    if(isNaN(m)||isNaN(e)||!Number.isInteger(e)){r.msg="Remplis les deux cases : le nombre (ex. 2,5) et l'exposant (ex. −10).";r.msgType="err";return;}
    ans=fmt(m)+" × 10"+sup(String(e).replace("-","−"))+(s.unit?" "+s.unit:"");
    const val=m*Math.pow(10,e),target=s.m*Math.pow(10,s.e);
    const valueOk=Math.abs(val-target)<=Math.abs(target)*(s.tol||0.02);
    const sciOk=Math.abs(m)>=1&&Math.abs(m)<10;
    ok=valueOk&&sciOk;pts=ok?1:0;
    if(valueOk&&!sciOk){r.tries++;if(r.first===null){r.first=false;r.pts=0;r.firstAns=ans+" (bonne valeur, pas en écriture scientifique)";}
      r.msg="✗ La valeur est juste, mais ce n'est pas l'écriture scientifique : le premier nombre doit être entre 1 et 10.";return;}
  }else if(s.kind==="rel"){
    const e=parseNum(v.e);
    if(isNaN(e)||!Number.isInteger(e)){r.msg="Écris un nombre entier (par exemple −5 ou 7).";r.msgType="err";return;}
    ok=e===s.a;pts=ok?1:0;ans=fmt(e);
  }else if(s.kind==="exp"){
    const e=parseNum(v.e);
    if(isNaN(e)||!Number.isInteger(e)){r.msg="Écris l'exposant (un nombre entier, par exemple −4).";r.msgType="err";return;}
    ok=e===s.e;pts=ok?1:0;ans="10"+sup(String(e).replace("-","−"));
  }
  r.tries++;
  if(r.first===null){r.first=ok;r.pts=pts;r.firstAns=ans;r.hintsBefore=r.hints;}
  if(ok){r.done=true;r.msg="";}
  else r.msg=s.kind==="classify"?"✗ Pas encore tout juste. Change les lignes marquées « à changer », ou prends un indice.":"✗ Pas encore. Relis la question, prends un indice ou réessaie.";
}
function nextEx(){
  if(st.e>=EX.length-1){st.done=true;st.t1=st.t1||Date.now();save();route();return;}
  const prev=EX[st.e].p;st.e++;st.intro=EX[st.e].p!==prev;save();route();
}

/* ---------- bilan ---------- */
function stats(){
  return PARTS.map(p=>{let got=0,tot=0;EX.forEach((x,ei)=>{if(x.p!==p.n)return;x.steps.forEach((s,si)=>{tot+=ptsOf(s);const r=st.R[key(ei,si)];if(r&&r.pts)got+=r.pts;});});return {p,got,tot};});
}
const pct=(a,b)=>b?Math.round(a/b*100):0;
const level=(a,b)=>{const q=pct(a,b);return q>=80?"Acquis":(q>=50?"Fragile":"À revoir");};
function fmtDate(t){const d=new Date(t);const z=n=>String(n).padStart(2,"0");return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} à ${z(d.getHours())}h${z(d.getMinutes())}`;}
function misses(){
  const out=[];
  EX.forEach((x,ei)=>x.steps.forEach((s,si)=>{const r=st.R[key(ei,si)];if(!r||r.first!==true)out.push({ei,si,x,s,r});}));
  return out;
}
function advice(S){
  const w=S.slice().sort((a,b)=>pct(a.got,a.tot)-pct(b.got,b.tot))[0];
  if(pct(w.got,w.tot)>=80)return "Excellent travail : les 4 réflexes sont en place. Tu es prête pour le contrôle blanc.";
  return "Priorité au "+w.p.title+". "+w.p.advice;
}
function bilanText(){
  const S=stats(),got=S.reduce((a,b)=>a+b.got,0),tot=S.reduce((a,b)=>a+b.tot,0);
  const dur=st.t0&&st.t1?Math.max(1,Math.round((st.t1-st.t0)/60000)):null;
  const hints=Object.values(st.R).reduce((a,r)=>a+(r.hints||0),0);
  const L2=[];
  L2.push("DEVOIR MAISON SÉANCE 2 — PHYSIQUE-CHIMIE 2nde");
  L2.push("L'atome : les 4 réflexes pour le contrôle");
  L2.push("Élève : (écris ton prénom)");
  L2.push("Fait le "+fmtDate(st.t1||Date.now())+(dur?" · durée : "+dur+" min":""));
  L2.push("");
  L2.push("SCORE AU PREMIER ESSAI : "+got+"/"+tot+" ("+pct(got,tot)+" %)");
  S.forEach(s=>L2.push(s.p.title+" : "+s.got+"/"+s.tot+" ("+pct(s.got,s.tot)+" %, "+level(s.got,s.tot)+")"));
  L2.push("Indices utilisés : "+hints);
  L2.push("");
  L2.push("PAR EXERCICE");
  EX.forEach((x,ei)=>{
    let g=0,t=0,h=0;x.steps.forEach((s,si)=>{t+=ptsOf(s);const r=st.R[key(ei,si)];if(r){g+=r.pts||0;h+=r.hints||0;}});
    L2.push("Ex "+(ei+1)+" ["+({F:"Facile",M:"Moyen",D:"Défi"})[x.lvl]+"] "+uni(x.title)+" : "+g+"/"+t+(h?" · "+h+" indice"+(h>1?"s":""):""));
  });
  const m=misses();
  L2.push("");
  L2.push("ERREURS AU PREMIER ESSAI (1re réponse / attendu)");
  if(!m.length)L2.push("- Aucune !");
  m.forEach(o=>{
    const lab="Ex "+(o.ei+1)+(o.x.steps.length>1?" q"+(o.si+1):"");
    if(!o.r||o.r.first===null)L2.push("- "+lab+" : pas de réponse (attendu "+expected(o.s)+")");
    else L2.push("- "+lab+" : "+o.r.firstAns+" / attendu "+(o.r.firstExp||expected(o.s))+(o.r.hintsBefore?" ("+o.r.hintsBefore+" indice"+(o.r.hintsBefore>1?"s":"")+" avant)":""));
  });
  const notions=[...new Set(m.map(o=>o.x.notion))];
  L2.push("");
  L2.push("NOTIONS À REVOIR");
  if(!notions.length)L2.push("- Aucune !");
  notions.forEach(n=>L2.push("- "+n));
  L2.push("");
  L2.push("CONSEIL");
  L2.push(advice(S));
  return L2.join("\n");
}
let dl=null;
function renderEnd(){
  const S=stats(),got=S.reduce((a,b)=>a+b.got,0),tot=S.reduce((a,b)=>a+b.tot,0);
  const txt=bilanText();const m=misses();const notions=[...new Set(m.map(o=>o.x.notion))];
  const subj="Bilan devoir séance 2 PC – L'atome";
  const wa="https://wa.me/?text="+encodeURIComponent(txt);
  const gm="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(MAIL)+"&su="+encodeURIComponent(subj)+"&body="+encodeURIComponent(txt);
  const bar=(a,b)=>{const k=Math.round(pct(a,b)/20);return "●".repeat(k)+"○".repeat(5-k);};
  show(`<span class="kicker">Bilan</span><h1>Bravo, tu as terminé ton devoir !</h1>
  <div class="card"><div class="total"><b>${got}/${tot}</b><span>au premier essai (${pct(got,tot)} %)</span></div></div>
  <div class="parts">${S.map(s=>`<div class="prt"><span class="n">${s.p.title}</span><span class="sc">${s.got}/${s.tot}</span>
   <span class="st"><span class="dots" aria-hidden="true">${bar(s.got,s.tot)}</span><b>${level(s.got,s.tot)}</b> (${pct(s.got,s.tot)} %)</span></div>`).join("")}</div>
  <div class="card"><div style="display:flex;flex-direction:column;gap:.5rem"><span class="kicker">Notions à revoir</span>
   ${notions.length?`<ul class="list">${notions.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:"<p>Aucune : tout était juste du premier coup !</p>"}</div></div>
  <div class="card"><div style="display:flex;flex-direction:column;gap:.5rem"><span class="kicker">Conseil</span><p>${esc(advice(S))}</p></div></div>
  <h2>Envoie ton bilan à Mr Moreira</h2>
  <div class="row">
   <button class="btn" id="dl" type="button" hidden>Télécharger mon bilan</button>
   <button class="btn" id="cp" type="button">Copier mon bilan</button>
   <a class="btn ghost" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Envoyer par WhatsApp</a>
   <a class="btn ghost" href="${gm}" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Envoyer par Gmail</a>
  </div>
  <p class="status" id="msg" role="status" aria-live="polite"></p>
  <p>Tu peux aussi montrer cet écran à ton professeur.</p>
  <p class="small">Tu peux aussi sélectionner le texte ci-dessous et le copier.</p>
  <pre class="report" id="rep">${esc(txt)}</pre>
  <details><summary>Refaire un exercice</summary><div class="inner">
   <p class="small">Ton score de premier essai ne change pas. Choisis l'exercice à revoir.</p>
   <div class="row">${EX.map((x,i)=>`<button class="btn ghost" type="button" data-go="${i}" style="flex:1 1 100%">Ex. ${i+1} · ${x.title}</button>`).join("")}</div>
  </div></details>
  <details><summary>Tout recommencer</summary><div class="inner"><p>Attention : tes réponses seront effacées. Envoie ton bilan avant.</p>
   <div class="row"><button class="btn ghost" id="rs" type="button">Oui, tout effacer et recommencer</button></div></div></details>`);
  const msg=document.getElementById("msg");
  document.getElementById("cp").onclick=()=>{
    const fallback=()=>{const rg=document.createRange();rg.selectNodeContents(document.getElementById("rep"));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);msg.textContent="Le texte est sélectionné : appuie sur « Copier ».";};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="✓ Bilan copié. Colle-le dans un message.";},fallback);}catch(e){fallback();}
  };
  const db=document.getElementById("dl");if(dl)db.hidden=false;
  db.onclick=async()=>{if(!dl)return;try{await dl.save({filename:"bilan-devoir-seance2.txt",data:txt});msg.textContent="✓ Bilan téléchargé.";}
   catch(e){const c=e&&e.code;msg.textContent=c==="declined"?"Téléchargement annulé.":(c==="rate_limited"?"Patiente un instant puis réessaie.":"Le téléchargement ne marche pas ici : utilise « Copier » ou WhatsApp.");}};
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{review=+b.dataset.go;renderReview();});
  document.getElementById("rs").onclick=()=>{st=fresh();save();route();};
}
/* revoir un exercice après le bilan : les réponses sont remises à zéro pour l'affichage, le score reste */
let review=null;
function renderReview(){
  const ei=review;const saved={};
  EX[ei].steps.forEach((s,si)=>{const k=key(ei,si);saved[k]=st.R[k];});
  const tmp=fresh();tmp.started=true;tmp.e=ei;tmp.intro=false;
  const backup=st;st=tmp;
  renderEx(false);
  const back=document.createElement("div");back.className="row";
  back.innerHTML=`<button class="btn ghost" type="button" id="backb">← Retour au bilan</button>`;
  app.appendChild(back);
  const nx=app.querySelector("[data-act=nextex]");
  const restore=()=>{st=backup;review=null;save();route();};
  document.getElementById("backb").onclick=restore;
  reviewRestore=restore;
}
let reviewRestore=null;
const _nextEx=nextEx;
function route(){
  if(review!==null)return;
  if(!st.started)return renderStart();
  if(st.done)return renderEnd();
  if(st.intro)return renderIntro();
  return renderEx(false);
}
/* en mode révision, « exercice suivant » ramène au bilan et rien n'est enregistré */
nextEx=function(){if(review!==null&&reviewRestore){reviewRestore();return;}_nextEx();};

load();applyUI();route();
try{if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>{dl=d;const b=document.getElementById("dl");if(b&&dl)b.hidden=false;}).catch(()=>{});}}catch(e){}
})();
</script>
<footer data-signature style="text-align:center;font-size:.8rem;opacity:.75;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">Mr Moreira · Vauban Luxembourg</footer>
