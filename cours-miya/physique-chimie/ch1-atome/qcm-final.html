<style>

.opt .L{grid-row:1 / span 2;width:2em;height:2em;display:grid;place-items:center;border:var(--bw) solid var(--pc);border-radius:8px;font-weight:bold;color:var(--pc)}
.opt .txt{min-width:0;overflow-wrap:normal}
.opt .mark{grid-column:2;font-size:.85rem;font-weight:bold}
.opt[aria-pressed="true"]{border-width:4px;border-color:var(--pc);background:var(--pc-tint)}
.opt[aria-pressed="true"] .L{border-width:4px;text-decoration:underline}
.opt.good{border:4px solid var(--ok);background:var(--ok-bg)}
.opt.bad{border:4px solid var(--ko);background:var(--ko-bg)}

.idk{align-self:flex-start;min-height:48px;font:inherit;font-size:.85rem;padding:.3rem .8rem;border-radius:10px;border:2px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}

.fb{border-radius:12px;padding:.8rem 1rem;border:var(--bw) solid}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.ko{border-color:var(--ko);background:var(--ko-bg)}

.fb.ok .v{color:var(--ok)} .fb.ko .v{color:var(--ko)}
.fb .why{margin-top:.4rem}
.step{display:block;margin-top:.25rem}

/* Notation du noyau A en haut, Z en bas */
.nuc{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}
.nuc .s{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.7em;line-height:1.05;margin-right:.06em}
sub,sup{font-size:.68em;line-height:0}

/* Bilan */
.total{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.total b{font-size:2.2rem;color:var(--pc);font-variant-numeric:tabular-nums}
.parts{display:grid;gap:.7rem}
.prt{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:center;border:var(--bw) solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--surface)}
.prt .n{min-width:0;font-weight:bold}
.prt .sc{font-weight:bold;font-variant-numeric:tabular-nums;color:var(--pc)}
.prt .st{grid-column:1 / -1;font-size:.85rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.dots{letter-spacing:.12em;font-size:.95rem}
.report{white-space:pre-wrap;font-family:var(--font);font-size:.8rem;line-height:1.45;background:var(--data-bg);border:2px solid var(--line);border-radius:12px;padding:.8rem;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere;margin:0}
.mail{overflow-wrap:anywhere;word-break:break-all;font-weight:bold;user-select:all;-webkit-user-select:all}
.status{min-height:1.5em;font-weight:bold}
details{border:var(--bw) solid var(--line);border-radius:12px;background:var(--surface)}
summary{min-height:56px;padding:.7rem 1rem;cursor:pointer;font-weight:bold;color:var(--pc)}
details .inner{padding:0 1rem 1rem;display:flex;flex-direction:column;gap:.9rem}
.rev{border-top:2px solid var(--line);padding-top:.7rem}
.rev .h{font-weight:bold}
.small{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

<script>
/* Hébergement classique (GitHub Pages) : le bilan se télécharge comme un fichier .txt */
(function(){
  if(window.claude) return;
  function save(o){
    return new Promise(function(res,rej){
      try{
        var txt=(o&&o.data!=null)?String(o.data):"";
        var blob=new Blob(["\ufeff"+txt],{type:"text/plain;charset=utf-8"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=(o&&o.filename)||"bilan.txt"; a.style.display="none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(url); a.remove();},15000);
        res();
      }catch(e){ rej({code:"failed"}); }
    });
  }
  window.claude={use:function(name){
    return name==="downloads" ? Promise.resolve({save:save}) : Promise.reject(new Error("indisponible"));
  }};
})();
</script>

<script>
(function(){
"use strict";
const MAIL="";
const STORE="qcm-atome-final-v1";
const nuc=(A,Z,X)=>`<span class="nuc" role="img" aria-label="${X}, A = ${A}, Z = ${Z}"><span class="s" aria-hidden="true"><span>${A}</span><span>${Z}</span></span><span aria-hidden="true">${X}</span></span>`;
const S=(n)=>`<span class="step">${n}</span>`;

const PARTS=[
 {n:1,title:"Les entités chimiques",cover:"Atome, molécule, cation, anion, formule d'un composé ionique.",
  advice:"Revois le tableau atome / molécule / cation / anion. Retiens : signe + = des électrons en moins ; signe − = des électrons en plus. Le noyau ne change jamais."},
 {n:2,title:"Le noyau et les particules",cover:"Numéro atomique Z, nombre de masse A, écriture du noyau, élément chimique, proton, neutron, électron.",
  advice:"Entraîne-toi à lire la notation du noyau : A en haut (nucléons), Z en bas (protons), et N = A − Z pour les neutrons."},
 {n:3,title:"Calculs : puissances de 10, tailles, masses",cover:"Écriture scientifique, quotient de puissances de 10, conversion de cm en m, masse d'un noyau, résultat plausible. Calculatrice autorisée. Les données utiles sont rappelées dans la question.",
  advice:"Refais les calculs avec la règle 10ᵃ ÷ 10ᵇ = 10ᵃ⁻ᵇ, écris l'unité à chaque ligne, et vérifie toujours si ton résultat est plausible (un atome ≈ 10⁻¹⁰ m)."},
 {n:4,title:"Cortège électronique et tableau périodique",cover:"Configuration électronique, électrons de valence, période et bloc, famille des gaz nobles.",
  advice:"Recopie l'ordre 1s 2s 2p 3s 3p (s : 2 électrons maximum, p : 6 maximum) et entraîne-toi sur les éléments de Z = 1 à 18."}
];

const Q=[
 {p:1,stem:"Parmi ces entités, laquelle est un anion&nbsp;?",opts:["K<sup>+</sup>","NO<sub>3</sub><sup>−</sup>","N<sub>2</sub>","Ar"],a:1,
  notion:"Reconnaître un anion",
  why:"NO<sub>3</sub><sup>−</sup> porte une charge <b>−</b> : c'est un anion, même s'il contient plusieurs atomes. K<sup>+</sup> est un cation, N<sub>2</sub> une molécule, Ar un atome."},
 {p:1,stem:"L'ion Al<sup>3+</sup> provient d'un atome d'aluminium qui a&nbsp;:",opts:["gagné 3 électrons","perdu 3 protons","perdu 3 électrons","gagné 3 protons"],a:2,
  notion:"Cation : un atome qui a perdu des électrons",
  why:"3+ signifie qu'il manque 3 électrons : l'atome a <b>perdu 3 électrons</b>. Les protons ne changent jamais."},
 {p:1,stem:"La formule CO<sub>2</sub> représente&nbsp;:",opts:["un cation","un anion","un atome","une molécule"],a:3,
  notion:"Reconnaître une molécule",
  why:"CO<sub>2</sub> : 3 atomes liés (1 C et 2 O), aucune charge : c'est une <b>molécule</b>."},
 {p:1,stem:"Un composé ionique contient des ions Na<sup>+</sup> et O<sup>2−</sup>. Sa formule est&nbsp;:",opts:["Na<sub>2</sub>O","NaO","NaO<sub>2</sub>","Na<sub>2</sub>O<sub>2</sub>"],a:0,
  notion:"Formule d'un composé ionique (électroneutralité)",
  why:"O<sup>2−</sup> apporte 2 charges −, chaque Na<sup>+</sup> une charge +."+S("2 × (+1) + (−2) = 0 → <b>Na<sub>2</sub>O</b>.")},
 {p:1,stem:"L'ion sulfure S<sup>2−</sup> (Z = 16) possède&nbsp;:",opts:["16 protons et 14 électrons","16 protons et 18 électrons","18 protons et 16 électrons","14 protons et 16 électrons"],a:1,
  notion:"Compter les électrons d'un ion",
  why:S("Le noyau ne change pas : <b>16 protons</b>.")+S("2− = 2 électrons en plus : 16 + 2 = <b>18 électrons</b>.")},

 {p:2,stem:`Dans l'écriture ${nuc(40,20,"Ca")}, le nombre 40 est&nbsp;:`,opts:["le numéro atomique Z","le nombre de neutrons","le nombre d'électrons","le nombre de masse A (nombre de nucléons)"],a:3,
  notion:"Le nombre de masse A",
  why:"Le nombre <b>en haut</b> est A, le nombre de nucléons (protons + neutrons). Le nombre en bas (20) est Z."},
 {p:2,stem:`Le noyau ${nuc(32,16,"S")} contient&nbsp;:`,opts:["16 protons et 16 neutrons","32 protons et 16 neutrons","16 protons et 32 neutrons","16 protons et 48 neutrons"],a:0,
  notion:"Composition d'un noyau (N = A − Z)",
  why:S("Z = 16 → 16 protons.")+S("N = A − Z = 32 − 16 = <b>16 neutrons</b>.")},
 {p:2,stem:"Un noyau de sodium contient 11 protons et 12 neutrons. Son écriture conventionnelle est&nbsp;:",opts:[nuc(11,23,"Na"),nuc(23,11,"Na"),nuc(12,11,"Na"),nuc(23,12,"Na")],a:1,
  notion:"Écrire la notation d'un noyau",
  why:S("A = 11 + 12 = 23 → <b>en haut</b>.")+S("Z = 11 → <b>en bas</b>.")+S("Écriture : "+nuc(23,11,"Na"))},
 {p:2,stem:"Quelle affirmation est exacte&nbsp;?",opts:["Un proton et un neutron ont presque la même masse","Le neutron porte la charge +e","Le noyau d'un atome est électriquement neutre","Un électron est plus lourd qu'un proton"],a:0,
  notion:"Charge et masse du proton, du neutron, de l'électron",
  why:"Proton et neutron : environ 1,67 × 10<sup>−27</sup> kg chacun. Le neutron est neutre, le noyau est <b>positif</b> (il contient les protons), et l'électron est environ 2 000 fois plus léger que le proton."},
 {p:2,stem:`${nuc(35,17,"Cl")} et ${nuc(37,17,"Cl")}&nbsp;:`,opts:["sont deux éléments différents, car A est différent","appartiennent au même élément, car ils ont le même nombre de neutrons","appartiennent au même élément, car ils ont le même Z = 17","sont deux éléments différents, car leurs masses sont différentes"],a:2,
  notion:"Élément chimique = même Z",
  why:"Même numéro atomique <b>Z = 17</b> → même élément (le chlore). Ils ont 18 et 20 neutrons : leur nombre de neutrons est différent."},

 {p:3,stem:"En écriture scientifique, 0,000 47 m s'écrit&nbsp;:",opts:["47 × 10<sup>−5</sup> m","4,7 × 10<sup>−4</sup> m","4,7 × 10<sup>−3</sup> m","4,7 × 10<sup>4</sup> m"],a:1,
  notion:"Écriture scientifique",
  why:"On déplace la virgule de <b>4 rangs</b> vers la droite pour obtenir 4,7 (entre 1 et 10) : <b>4,7 × 10<sup>−4</sup> m</b>. 47 × 10<sup>−5</sup> a la bonne valeur, mais 47 n'est pas entre 1 et 10."},
 {p:3,stem:"Combien vaut 10<sup>−9</sup> ÷ 10<sup>−12</sup>&nbsp;?",opts:["10<sup>−21</sup>","10<sup>−3</sup>","10<sup>3</sup>","10<sup>21</sup>"],a:2,
  notion:"Diviser des puissances de 10",
  why:S("10<sup>a</sup> ÷ 10<sup>b</sup> = 10<sup>a−b</sup>")+S("10<sup>−9−(−12)</sup> = 10<sup>−9+12</sup> = <b>10<sup>3</sup></b>")},
 {p:3,stem:"Le rayon d'un atome de carbone vaut 7,0 × 10<sup>−9</sup> <b>cm</b>. En mètres&nbsp;:",
  data:"1 m = 100 cm",
  opts:["7,0 × 10<sup>−7</sup> m","7,0 × 10<sup>−11</sup> m","7,0 × 10<sup>−10</sup> m","7,0 × 10<sup>−8</sup> m"],a:1,
  notion:"Convertir des cm en m avec les puissances de 10",
  why:S("1 cm = 10<sup>−2</sup> m")+S("7,0 × 10<sup>−9</sup> cm = 7,0 × 10<sup>−9</sup> × 10<sup>−2</sup> m = <b>7,0 × 10<sup>−11</sup> m</b>")+S("Vérification : en mètres, le nombre doit être plus petit qu'en centimètres.")},
 {p:3,stem:`La masse du noyau ${nuc(16,8,"O")}, écrite avec 3 chiffres significatifs, vaut&nbsp;:`,
  data:"Masse d'un nucléon = 1,67 × 10<sup>−27</sup> kg (3 chiffres significatifs)",
  opts:["1,34 × 10<sup>−26</sup> kg","2,67 × 10<sup>−28</sup> kg","2,67 × 10<sup>−26</sup> kg","2,672 × 10<sup>−26</sup> kg"],a:2,
  notion:"Masse d'un noyau et chiffres significatifs",
  why:S("A = 16 nucléons")+S("m = 16 × 1,67 × 10<sup>−27</sup> kg = 26,72 × 10<sup>−27</sup> kg = 2,672 × 10<sup>−26</sup> kg")+S("Avec 3 chiffres significatifs : <b>2,67 × 10<sup>−26</sup> kg</b>.")+S("Piège : utiliser Z = 8 au lieu de A = 16, ou garder 4 chiffres.")},
 {p:3,stem:"Sarah calcule le rayon du <b>noyau</b> d'un atome et trouve 4 × 10<sup>−10</sup> m. Son résultat est-il plausible&nbsp;?",
  opts:["Oui : c'est très petit","Oui : un noyau mesure environ 10<sup>−10</sup> m","Non : un noyau mesure environ 10<sup>−3</sup> m","Non : 4 × 10<sup>−10</sup> m est la taille d'un atome entier ; un noyau mesure environ 10<sup>−15</sup> m"],a:3,
  notion:"Ordres de grandeur : atome et noyau (résultat plausible ?)",
  why:"Un atome mesure environ <b>10<sup>−10</sup> m</b>, son noyau environ <b>10<sup>−15</sup> m</b>, 100 000 fois plus petit. Trouver 4 × 10<sup>−10</sup> m pour un noyau n'est pas plausible : il faut refaire le calcul."},

 {p:4,stem:"La configuration électronique du chlore (Z = 17) est&nbsp;:",opts:["1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>5</sup>","1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>6</sup>","1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3p<sup>7</sup>","1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>5</sup> 3s<sup>2</sup> 3p<sup>6</sup>"],a:0,
  notion:"Écrire une configuration électronique",
  why:"Ordre 1s, 2s, 2p, 3s, 3p ; s : 2 maximum, p : 6 maximum."+S("2 + 2 + 6 + 2 + 5 = 17 → <b>1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>5</sup></b>.")},
 {p:4,stem:"Le magnésium a pour configuration 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup>. Il possède&nbsp;:",opts:["12 électrons de valence","8 électrons de valence","2 électrons de valence","6 électrons de valence"],a:2,
  notion:"Électrons de valence",
  why:"Dernière couche : n = 3, qui ne contient que 3s<sup>2</sup> → <b>2 électrons de valence</b>. 12 est le nombre total d'électrons."},
 {p:4,stem:"L'azote a pour configuration 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>3</sup>. Il se trouve&nbsp;:",opts:["dans la 2<sup>e</sup> période, bloc p","dans la 3<sup>e</sup> période, bloc p","dans la 2<sup>e</sup> période, bloc s","dans la 1<sup>re</sup> période, bloc p"],a:0,
  notion:"Position dans le tableau : période et bloc",
  why:S("Dernière couche n = 2 → <b>2<sup>e</sup> période</b>.")+S("Dernière sous-couche 2p → <b>bloc p</b>.")},
 {p:4,stem:"Un élément est le 2<sup>e</sup> élément de la 3<sup>e</sup> période (colonne 2, bloc s). Sa configuration est&nbsp;:",opts:["1s<sup>2</sup> 2s<sup>2</sup>","1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>2</sup>","1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>2</sup>","1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup>"],a:3,
  notion:"Configuration à partir de la position dans le tableau",
  why:S("3<sup>e</sup> période → la dernière couche est n = 3, donc 1s, 2s et 2p sont pleins.")+S("Colonne 2 → 3s<sup>2</sup> : <b>1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup></b> (magnésium, Z = 12).")},
 {p:4,stem:"Le néon (1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup>) et l'argon (1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>6</sup>) appartiennent à la même famille, car&nbsp;:",opts:["ils ont le même nombre total d'électrons","ils ont le même nombre de couches","ils sont dans la même période","leur couche externe est saturée (8 électrons de valence) : ce sont des gaz nobles"],a:3,
  notion:"Famille chimique : la famille des gaz nobles",
  why:"Même colonne = même nombre d'électrons de valence = propriétés communes. Ici, couche externe <b>saturée</b> (2s<sup>2</sup> 2p<sup>6</sup> et 3s<sup>2</sup> 3p<sup>6</sup>) : ce sont des <b>gaz nobles</b>, très peu réactifs. Ils ne sont pas dans la même période (2 et 3)."}
];
const LET=["A","B","C","D"];
const N=Q.length;

/* ---------- état ---------- */
const fresh=()=>({i:0,intro:true,started:false,done:false,ans:{},t0:null,t1:null,sel:null});
let st=fresh();
let ui={fs:24,hc:false,theme:"auto"};
function load(){try{const r=localStorage.getItem(STORE);if(r){const o=JSON.parse(r);if(o&&o.st)st=Object.assign(fresh(),o.st);if(o&&o.ui)ui=Object.assign(ui,o.ui);}}catch(e){}}
function save(){try{localStorage.setItem(STORE,JSON.stringify({st,ui}));}catch(e){}}

/* ---------- affichage ---------- */
const root=document.documentElement;
const hostTheme=root.getAttribute("data-theme");
function applyUI(){
  root.style.setProperty("--fs",ui.fs+"px");
  if(ui.hc)root.setAttribute("data-contrast","high");else root.removeAttribute("data-contrast");
  if(ui.theme==="light"||ui.theme==="dark")root.setAttribute("data-theme",ui.theme);
  else{ if(hostTheme)root.setAttribute("data-theme",hostTheme);else root.removeAttribute("data-theme"); }
  const hc=document.getElementById("hc");hc.setAttribute("aria-pressed",ui.hc?"true":"false");
  document.getElementById("theme").textContent="Thème : "+({auto:"auto",light:"clair",dark:"sombre"})[ui.theme];
}
document.getElementById("fsMinus").onclick=()=>{ui.fs=Math.max(18,ui.fs-2);applyUI();save();};
document.getElementById("fsPlus").onclick=()=>{ui.fs=Math.min(40,ui.fs+2);applyUI();save();};
document.getElementById("hc").onclick=()=>{ui.hc=!ui.hc;applyUI();save();};
document.getElementById("theme").onclick=()=>{ui.theme=({auto:"light",light:"dark",dark:"auto"})[ui.theme];applyUI();save();};

const app=document.getElementById("app");
function show(html){app.innerHTML=html;window.scrollTo(0,0);const h=app.querySelector("h1,h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}}
function progress(){
  const n=Object.keys(st.ans).length;
  return `<div class="progress"><span class="lab">${n} question${n>1?"s":""} sur ${N} terminée${n>1?"s":""}</span><div class="bar" aria-hidden="true"><i style="width:${Math.round(n/N*100)}%"></i></div></div>`;
}

function renderStart(){
  const resume=st.started&&!st.done;
  show(`
  <h1>QCM final : l'atome et les entités chimiques</h1>
  <div class="card"><div style="display:flex;flex-direction:column;gap:.6rem">
    <p><b>20 questions</b> en <b>4 parties</b>. Durée conseillée : <b>25 minutes</b>.</p>
    <ul class="list">
      <li>Une seule bonne réponse par question.</li>
      <li>Pas de points négatifs : réponds à tout.</li>
      <li>Tu as le droit à la calculatrice.</li>
      <li>Si tu ne sais vraiment pas, appuie sur « Je ne sais pas encore » : ça m'aide à savoir quoi travailler.</li>
    </ul>
  </div></div>
  <div class="card"><div style="display:flex;flex-direction:column;gap:.5rem">
    <span class="kicker">Les 4 parties</span>
    <ol class="list">${PARTS.map(p=>`<li><b>${p.title}</b></li>`).join("")}</ol>
  </div></div>
  <p class="small">Ce QCM a la même structure que le QCM diagnostic, avec des questions nouvelles : il montre tes progrès partie par partie. Ce n'est pas une note de classe.</p>
  <div class="row">
    ${resume?`<button class="btn" id="go" type="button">Reprendre (question ${Math.min(st.i+1,N)})</button>`:`<button class="btn" id="go" type="button">Commencer</button>`}
  </div>`);
  document.getElementById("go").onclick=()=>{
    if(!st.started){st.started=true;st.t0=Date.now();}
    save();route();
  };
}

function renderIntro(){
  const p=PARTS[Q[st.i].p-1];
  show(`${progress()}
  <span class="kicker">Partie ${p.n} sur 4</span>
  <h1>${p.title}</h1>
  <div class="card"><p>${p.cover}</p></div>
  <p>5 questions.</p>
  <div class="row"><button class="btn" id="go" type="button">C'est parti</button></div>`);
  document.getElementById("go").onclick=()=>{st.intro=false;save();route();};
}

function renderQ(){
  const i=st.i,q=Q[i],p=PARTS[q.p-1],done=st.ans[i];
  const sel=done?done.c:st.sel;
  const optsHtml=q.opts.map((o,k)=>{
    let cls="opt",mark="",pressed=(sel===k)?"true":"false";
    if(done){
      if(k===q.a){cls+=" good";mark="✓ Bonne réponse";}
      else if(k===done.c){cls+=" bad";mark="✗ Ta réponse";}
    }else if(sel===k){mark="◉ Choisie";}
    return `<li><button class="${cls}" type="button" data-k="${k}" aria-pressed="${pressed}" ${done?"disabled":""}><span class="L" aria-hidden="true">${LET[k]}</span><span class="txt"><span class="sr" style="position:absolute;left:-9999px">${LET[k]}. </span>${o}</span>${mark?`<span class="mark">${mark}</span>`:""}</button></li>`;
  }).join("");
  let fb="";
  if(done){
    if(done.ok)fb=`<div class="fb ok" role="status"><div class="v">✓ Bonne réponse !</div><div class="why">${q.why}</div></div>`;
    else if(done.c===-1)fb=`<div class="fb ko" role="status"><div class="v">✗ Pas encore su. La bonne réponse est ${LET[q.a]}.</div><div class="why">${q.why}</div></div>`;
    else fb=`<div class="fb ko" role="status"><div class="v">✗ Pas tout à fait. La bonne réponse est ${LET[q.a]}.</div><div class="why">${q.why}</div></div>`;
  }
  const last=i===N-1;
  show(`${progress()}
  <span class="kicker">Partie ${p.n} · ${p.title}</span>
  <h2>Question ${i+1} sur ${N}</h2>
  <p class="stem">${q.stem}</p>
  ${q.data?`<div class="data"><div class="t">Données</div><div>${q.data}</div></div>`:""}
  <ul class="opts">${optsHtml}</ul>
  ${done?fb:`<button class="idk" id="idk" type="button">Je ne sais pas encore</button>`}
  <div class="row">
    ${done?`<button class="btn" id="next" type="button">${last?"Voir mon bilan":"Question suivante →"}</button>`
         :`<button class="btn" id="val" type="button" ${sel===null||sel===undefined?"disabled":""}>Valider ma réponse</button>`}
  </div>`);
  if(!done){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.sel=+b.dataset.k;save();renderQKeep(+b.dataset.k);});
    document.getElementById("val").onclick=()=>answer(st.sel);
    document.getElementById("idk").onclick=()=>answer(-1);
  }else{
    document.getElementById("next").onclick=next;
  }
}
/* sélection sans perdre la position de lecture */
function renderQKeep(k){
  app.querySelectorAll(".opt").forEach(b=>{
    const on=+b.dataset.k===k;b.setAttribute("aria-pressed",on?"true":"false");
    let m=b.querySelector(".mark");
    if(on){if(!m){m=document.createElement("span");m.className="mark";b.appendChild(m);}m.textContent="◉ Choisie";}
    else if(m)m.remove();
  });
  const v=document.getElementById("val");if(v)v.disabled=false;
}
function answer(c){
  if(c===null||c===undefined)return;
  const q=Q[st.i];
  st.ans[st.i]={c:c,ok:c===q.a};
  st.sel=null;save();renderQ();
  const fb=app.querySelector(".fb");if(fb)fb.scrollIntoView({block:"nearest"});
}
function next(){
  if(st.i>=N-1){st.done=true;st.t1=st.t1||Date.now();save();route();return;}
  const prev=Q[st.i].p;st.i++;st.sel=null;
  st.intro=Q[st.i].p!==prev;save();route();
}

/* ---------- bilan ---------- */
function stats(){
  return PARTS.map(p=>{
    const idx=Q.map((q,i)=>i).filter(i=>Q[i].p===p.n);
    const sc=idx.filter(i=>st.ans[i]&&st.ans[i].ok).length;
    return {p,idx,sc,tot:idx.length};
  });
}
const level=s=>s===5?"Acquis":(s>=3?"Fragile":"À revoir");
const dots=s=>"●".repeat(s)+"○".repeat(5-s);
function fmtDate(t){const d=new Date(t);const z=n=>String(n).padStart(2,"0");return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} à ${z(d.getHours())}h${z(d.getMinutes())}`;}
function bilanText(){
  const S2=stats(),tot=S2.reduce((a,b)=>a+b.sc,0);
  const dur=st.t0&&st.t1?Math.max(1,Math.round((st.t1-st.t0)/60000)):null;
  const L=[];
  L.push("QCM FINAL — PHYSIQUE-CHIMIE 2nde");
  L.push("L'atome et les entités chimiques");
  L.push("Élève : (écris ton prénom)");
  L.push("Fait le "+fmtDate(st.t1||Date.now())+(dur?" · durée : "+dur+" min":""));
  L.push("");
  L.push("SCORE TOTAL : "+tot+"/20");
  S2.forEach(s=>L.push("Partie "+s.p.n+" – "+s.p.title+" : "+s.sc+"/5 ("+level(s.sc)+")"));
  L.push("");
  L.push("DÉTAIL (réponse donnée / bonne réponse)");
  Q.forEach((q,i)=>{
    const a=st.ans[i];
    if(!a)L.push("Q"+(i+1)+" — pas de réponse (attendu "+LET[q.a]+")");
    else if(a.ok)L.push("Q"+(i+1)+" ✓ "+LET[a.c]);
    else if(a.c===-1)L.push("Q"+(i+1)+" ✗ je ne sais pas encore (attendu "+LET[q.a]+")");
    else L.push("Q"+(i+1)+" ✗ "+LET[a.c]+" (attendu "+LET[q.a]+")");
  });
  const wrong=Q.map((q,i)=>i).filter(i=>!(st.ans[i]&&st.ans[i].ok));
  L.push("");
  L.push("NOTIONS À REVOIR");
  if(!wrong.length)L.push("- Aucune : tout est juste !");
  wrong.forEach(i=>L.push("- Q"+(i+1)+" : "+Q[i].notion));
  L.push("");
  L.push("CONSEIL");
  L.push(advice(S2));
  return L.join("\n");
}
function advice(S2){
  const tot=S2.reduce((a,b)=>a+b.sc,0);
  const weak=S2.slice().sort((a,b)=>a.sc-b.sc)[0];
  if(weak.sc>=4)return "Très bon résultat ("+tot+"/20) : le chapitre est bien en place. Relis les corrections de tes erreurs avant le contrôle.";
  return "Priorité à la partie "+weak.p.n+" ("+weak.p.title+"). "+weak.p.advice;
}

let dl=null;
function renderEnd(){
  const S2=stats(),tot=S2.reduce((a,b)=>a+b.sc,0);
  const txt=bilanText();
  const wrong=Q.map((q,i)=>i).filter(i=>!(st.ans[i]&&st.ans[i].ok));
  const subj="Bilan QCM final PC – L'atome";
  const wa="https://wa.me/?text="+encodeURIComponent(txt);
  const gm="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(MAIL)+"&su="+encodeURIComponent(subj)+"&body="+encodeURIComponent(txt);
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  show(`
  <span class="kicker">Bilan</span>
  <h1>Bravo, tu as terminé le QCM !</h1>
  <div class="card"><div class="total"><b>${tot}/20</b><span>bonnes réponses</span></div></div>
  <div class="parts">${S2.map(s=>`
    <div class="prt"><span class="n">Partie ${s.p.n} · ${s.p.title}</span><span class="sc">${s.sc}/5</span>
    <span class="st"><span class="dots" aria-hidden="true">${dots(s.sc)}</span><b>${level(s.sc)}</b></span></div>`).join("")}
  </div>
  <div class="card"><div style="display:flex;flex-direction:column;gap:.5rem">
    <span class="kicker">Notions à revoir</span>
    ${wrong.length?`<ul class="list">${wrong.map(i=>`<li>Q${i+1} : ${esc(Q[i].notion)}</li>`).join("")}</ul>`:"<p>Aucune : tout est juste !</p>"}
  </div></div>
  <div class="card"><div style="display:flex;flex-direction:column;gap:.5rem">
    <span class="kicker">Conseil</span><p>${esc(advice(S2))}</p>
  </div></div>

  <h2>Envoie ton bilan à Mr Moreira</h2>
  <div class="row">
    <button class="btn" id="dl" type="button" hidden>Télécharger mon bilan</button>
    <button class="btn" id="cp" type="button">Copier mon bilan</button>
    <a class="btn ghost" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Envoyer par WhatsApp</a>
    <a class="btn ghost" href="${gm}" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Envoyer par Gmail</a>
  </div>
  <p class="status" id="msg" role="status" aria-live="polite"></p>
  <p>Tu peux aussi montrer cet écran à ton professeur.</p>
  <p class="small">Tu peux aussi sélectionner le texte ci-dessous et le copier.</p>
  <pre class="report" id="rep">${esc(txt)}</pre>

  <details><summary>Revoir les corrections des 20 questions</summary><div class="inner">
    ${Q.map((q,i)=>{const a=st.ans[i];const ok=a&&a.ok;
      const yours=!a?"pas de réponse":(a.c===-1?"je ne sais pas encore":LET[a.c]);
      return `<div class="rev"><div class="h">Q${i+1} ${ok?"✓ juste":"✗ à revoir"}</div><p>${q.stem}</p>${q.data?`<div class="data"><div class="t">Données</div><div>${q.data}</div></div>`:""}<p>Ta réponse : <b>${yours}</b> · Bonne réponse : <b>${LET[q.a]}</b> (${q.opts[q.a]})</p><p>${q.why}</p></div>`;}).join("")}
  </div></details>

  <details id="resetBox"><summary>Recommencer le QCM</summary><div class="inner">
    <p>Attention : tes réponses seront effacées. Envoie ton bilan avant.</p>
    <div class="row"><button class="btn ghost" id="rs" type="button">Oui, tout effacer et recommencer</button></div>
  </div></details>`);

  const msg=document.getElementById("msg");
  document.getElementById("cp").onclick=()=>{
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("rep"));const s=window.getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="Le texte est sélectionné : appuie sur « Copier ».";};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="✓ Bilan copié. Colle-le dans un message.";},fallback);}catch(e){fallback();}
  };
  const dbtn=document.getElementById("dl");
  if(dl)dbtn.hidden=false;
  dbtn.onclick=async()=>{
    if(!dl)return;
    try{await dl.save({filename:"bilan-QCM-final-atome.txt",data:txt});msg.textContent="✓ Bilan téléchargé.";}
    catch(e){const c=e&&e.code;msg.textContent=c==="declined"?"Téléchargement annulé.":(c==="rate_limited"?"Patiente un instant puis réessaie.":"Le téléchargement ne marche pas ici : utilise « Copier » ou WhatsApp.");}
  };
  document.getElementById("rs").onclick=()=>{st=fresh();save();route();};
}

function route(){
  if(!st.started)return renderStart();
  if(st.done)return renderEnd();
  if(st.intro)return renderIntro();
  return renderQ();
}

load();applyUI();route();
try{
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(d=>{dl=d;const b=document.getElementById("dl");if(b&&dl)b.hidden=false;}).catch(()=>{});
  }
}catch(e){}
})();
</script>
<footer data-signature style="text-align:center;font-size:.8rem;opacity:.75;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">Mr Moreira · Vauban Luxembourg</footer>
</body>
</html>
