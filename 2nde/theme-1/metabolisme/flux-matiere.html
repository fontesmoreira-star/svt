<style>
/* Layout : bandeau SVT vert foncé ; vues Sommaire (missions → tuiles de séances), Séance (barre collante avec minuteur, 4 cartes-questions dont le document animé), Révision, Progression, Bilan ; colonne 980 px (1400 px en projection) */
:root{

  --t-r6:#6a3fa0; --t-sp:#0b6170; --t-se:#a14f00; --t-doc:#1d5fa8;
  --sky:#0e1a2b; --sun:#f2b705; --sunglow:rgba(242,183,5,.35); --water:#4b9fd6; --water-2:#2f7fb5; --ice:#cfe8f7;

  --f-display:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;

}

  --metal:#9aaab0; --wire:#b0bec5; --bone:#d8d0bb; --rock:#8a8580; --rock-l:#d8cfbf; --paper:#1d2a22; --o2:#8ab8f2; --co2:#b6a898;

}}

html{font-size:var(--fs)}
html.proj{--maxw:1400px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}

button,input,textarea{font:inherit;color:inherit}

.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.eyebrow{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--band-muted)}
.band h1{font-size:clamp(1.4rem,4.4vw,2.1rem);font-weight:800;margin-top:2px}

.tbtn{min-height:48px;min-width:48px;padding:0 12px;border-radius:12px;border:1.5px solid color-mix(in oklab,var(--band-ink) 35%,transparent);background:transparent;color:var(--band-ink);font-weight:700;cursor:pointer;font-size:.9rem}
.tbtn[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

main .wrap{padding-block:22px 64px}
section.view{display:flex;flex-direction:column;gap:20px}
.kicker{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.h2{font-size:clamp(1.3rem,3.4vw,1.75rem);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}

.btn{max-width:100%}

.weak .btn{white-space:normal;justify-content:flex-start;text-align:left;padding-block:8px}
@media (max-width:560px){.hl{display:none}.sbar .ttl{font-size:.95rem}.sbar .wrap{gap:6px 8px}}
.btn.sm{min-height:48px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}

.box{border-radius:14px;padding:12px 16px;border-left:6px solid;display:flex;flex-direction:column;gap:6px;min-width:0}

.box.info{background:var(--info-soft);border-color:var(--info)}.box.info .bt{color:var(--info)}

/* Sommaire */

@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}

.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}

.qstat{margin-left:auto;font-size:.9rem;font-weight:700;color:var(--muted)}

.ins{font-size:.9rem;color:var(--muted)}
.part{display:flex;flex-direction:column;gap:8px;min-width:0}

.opts{display:flex;flex-direction:column;gap:8px}
.opts.inline{flex-direction:row;flex-wrap:wrap}

<script>
/* Hébergement classique (GitHub Pages) : le bilan se télécharge comme un fichier .txt */
(function(){
  if(window.claude) return;
  function save(o){
    return new Promise(function(res,rej){
      try{
        var txt=(o&&o.data!=null)?String(o.data):"";
        var blob=new Blob(["\ufeff"+txt],{type:"text/plain;charset=utf-8"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=(o&&o.filename)||"bilan.txt"; a.style.display="none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(url); a.remove();},15000);
        res();
      }catch(e){ rej({code:"failed"}); }
    });
  }
  window.claude={use:function(name){
    return name==="downloads" ? Promise.resolve({save:save}) : Promise.reject(new Error("indisponible"));
  }};
})();
</script>

 "Un flux de matière est un déplacement de matière : dans un organisme (sèves brute et élaborée), entre organismes, ou entre un organisme et son milieu.",

/* ---------- données ---------- */
function norm(sp){return sp.t==="parts"?sp:{t:"parts",h:sp.h,parts:[sp]};}
const QS=[];STEPS.forEach((s,si)=>s.blocks.forEach(b=>{if(b.q){const q=b.q;q.spec=norm(q.spec);q.sn=si+1;q.tagRaw="";q.tc={f:"sp",m:"se",d:"r6"}[q.lv];q.tl={f:"🟢 Facile",m:"🟡 Moyen",d:"🔴 Défi"}[q.lv];QS.push(q);}}));
const QBY={};QS.forEach((q,i)=>{q.k=i+1;QBY[q.id]=q;});
function nz(s){return String(s==null?"":s).toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/₂/g,"2").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let p=new Array(n+1);for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function has(t,alts,exact){const T=" "+t+" ",toks=t.split(" ");return alts.split("|").some(st=>{st=nz(st);if(!st)return false;if(T.indexOf(" "+st)>=0)return true;
  if(!exact&&st.indexOf(" ")<0&&st.length>=5){const tol=st.length>=9?2:1;return toks.some(w=>w.length>=st.length-1&&lev(w.slice(0,st.length),st)<=tol);}return false;});}
function parseNum(s){const t=String(s==null?"":s).trim().replace(/\s/g,"").replace(/[−–]/g,"-").replace(",",".");return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):null;}

/* ---------- mélange déterministe ---------- */
function seedOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function perm(n,seed){const a=[...Array(n).keys()];let x=seed||1;for(let i=n-1;i>0;i--){x=(Math.imul(x,1103515245)+12345)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  if(n>1&&a.every((v,i)=>v===i)){a.push(a.shift());}return a;}

/* ---------- évaluation ---------- */
function evalPart(p,a){
  switch(p.t){
    case "txt":{const t=nz(a);if(!t)return {empty:true};
      if(p.bad&&has(t,p.bad,true))return {ok:false};
      if(p.p){const f=p.p.filter(x=>has(t,x)).length;return {ok:f>=p.n,found:f};}
      const al=Array.isArray(p.a)?p.a:[p.a];return {ok:al.every(x=>has(t,x))};}
    case "txtf":{const v=a||[];if(p.f.some((f,i)=>!nz(v[i])))return {empty:true};const m=p.f.map((f,i)=>{const t=nz(v[i]);const al=Array.isArray(f.a)?f.a:[f.a];return al.every(x=>has(t,x));});return {ok:m.every(Boolean),m};}
    case "mcq":{if(a==null)return {empty:true};return {ok:a===0};}
    case "multi":{const v=a||[];if(!v.length)return {empty:true};const wrong=v.some(i=>i>=p.k),good=v.filter(i=>i<p.k).length;return {ok:!wrong&&(p.min?good>=p.min:good===p.k)};}
    case "num":{const v=a||[];const x=p.f.map((f,i)=>parseNum(v[i]));if(x.some(y=>y===null))return {empty:true};const m=p.f.map((f,i)=>Math.abs(x[i]-f.v)<=f.tol+1e-9);
      let msg="";p.f.forEach((f,i)=>{if(!m[i]&&f.alt&&f.alt.some(z=>Math.abs(x[i]-z[0])<1e-9))msg=f.alt.find(z=>Math.abs(x[i]-z[0])<1e-9)[1];});return {ok:m.every(Boolean),m,msg};}
    case "order":{const v=a||[];if(v.length<p.o.length)return {empty:true};const m=v.map((x,i)=>x===i);return {ok:m.every(Boolean),m};}
    case "match":{const v=a||[];if(p.r.some((r,i)=>v[i]==null))return {empty:true};const m=p.r.map((r,i)=>v[i]===p.a[i]);return {ok:m.every(Boolean),m};}
  }
  return {ok:false};
}
function evalQ(q,ans){const rs=q.spec.parts.map((p,i)=>evalPart(p,ans[i]));return {parts:rs,empty:rs.some(r=>r.empty),ok:rs.every(r=>r.ok)};}

/* ---------- coups de pouce ---------- */
const ART=/^(le |la |les |l'|l’|un |une |des |du |de la |de l'|d'|en |dans |au |aux |par |se |sa |son |ses )+/i;
function words(s){return String(s).split(/\s*,\s*|\s+et\s+|\s*;\s*/).map(w=>w.replace(ART,"").replace(/\(.*?\)/g,"").replace(/…/g,"").trim()).filter(Boolean);}
function txtHint(s,L){const w=words(s);if(L===1)return "Commence par « "+w.map(x=>x[0].toUpperCase()+"…").join(" », « ")+" ».";return w.map(x=>"« "+x.slice(0,Math.max(2,Math.ceil(x.length/2)))+"… » ("+x.replace(/[\s’'-]/g,"").length+" lettres)").join(" ; ");}
function wrongOrder(q,pi,p){return perm(p.o.length,seedOf(q.id+"w"+pi)).filter(i=>i>=(p.t==="multi"?p.k:1));}
function hintFx(q,L){ // effets cumulés pour le niveau L
  const fx={txt:[],gone:{},ord:{},mt:{}};const sp=q.spec;const steps=[];
  if(sp.h)steps.push({h:sp.h});steps.push({lv:1});steps.push({lv:2});
  for(let s=0;s<Math.min(L,steps.length);s++){const st=steps[s];
    if(st.h){fx.txt.push(st.h);continue;}
    sp.parts.forEach((p,pi)=>{const pre=sp.parts.length>1?"Partie "+(pi+1)+" : ":"";const lv=st.lv;
      if(p.t==="txt"){fx.txt.push(pre+(p.h&&lv===1?p.h:txtHint(p.s,lv)));}
      else if(p.t==="txtf"){p.f.forEach(f=>fx.txt.push(pre+f.l+" — "+txtHint(f.s,lv)));}
      else if(p.t==="mcq"){const n=Math.min(lv,p.o.length-2);if(n>0){fx.gone[pi]=n;fx.txt.push(pre+(n>1?n+" mauvaises réponses sont barrées.":"Une mauvaise réponse est barrée."));}else fx.txt.push(pre+"Relis bien la question et le document : une seule réponse est juste.");}
      else if(p.t==="multi"){if(lv===1)fx.txt.push(pre+"Il y a "+p.k+" bonne"+(p.k>1?"s":"")+" réponse"+(p.k>1?"s":"")+(p.min?" (il en faut au moins "+p.min+")":"")+".");else{fx.gone[pi]=1;fx.txt.push(pre+"Une mauvaise réponse est barrée.");}}
      else if(p.t==="num"){if(lv===1)fx.txt.push(pre+(p.h||"Relis le document et pose le calcul dans ton cahier."));else p.f.forEach(f=>{const d=Math.max(1,Math.abs(f.v)*.25);fx.txt.push(pre+f.l+" : entre "+frn(Math.floor(f.v-d))+" et "+frn(Math.ceil(f.v+d))+(f.u?" "+f.u:"")+".");});}
      else if(p.t==="order"){fx.ord[pi]=Math.min(lv,p.o.length-1);fx.txt.push(pre+"Début de l'ordre : "+p.o.slice(0,fx.ord[pi]).join(" → ")+" → …");}
      else if(p.t==="match"){fx.mt[pi]=Math.min(lv,p.r.length-1);for(let r=0;r<fx.mt[pi];r++)fx.txt.push(pre+"« "+p.r[r]+" » → « "+p.c[p.a[r]]+" »");}
    });
  }
  return {fx,max:steps.length};
}

/* ---------- carte-question ---------- */
const lastFb={};
const LETTERS="ABCDEFGH";

function renderStatus(q,ctx){
  const st=ctx.st(q),s=$("st-"+ctx.p+q.id),fb=$("fb-"+ctx.p+q.id);if(!s)return;
  if(st.done){s.textContent=st.first?"✓ Réussi au 1er essai":"✓ Réussi";s.className="qstat ok";}
  else if(st.tries){s.textContent="✗ "+st.tries+" essai"+(st.tries>1?"s":"");s.className="qstat bad";}else{s.textContent="";s.className="qstat";}
  const L=lastFb[ctx.p+q.id];
  if(L&&L.empty)fb.innerHTML='<div class="fb bad">Réponds à toutes les parties avant de vérifier.</div>';
  else if(L&&L.ok)fb.innerHTML='<div class="fb ok"><strong>✓ Juste !</strong> '+(st.first&&st.tries===1?"Du premier coup, bravo.":"Bien corrigé.")+'</div>';
  else if(L)fb.innerHTML='<div class="fb bad"><strong>✗ Pas encore.</strong> '+(q.spec.parts.length>1?"Vérifie les parties marquées ✗. ":"")+'Utilise un coup de pouce, puis corrige ta réponse (le corrigé apparaît au 2e essai).</div>';
  else fb.innerHTML="";
  const H=hintFx(q,st.hints||0),hb=$("hnt-"+ctx.p+q.id);
  hb.disabled=(st.hints||0)>=H.max||!!st.done;hb.textContent=(st.hints||0)>=H.max?"Plus de coup de pouce":"Coup de pouce "+((st.hints||0)+1)+"/"+H.max;
  $("hs-"+ctx.p+q.id).innerHTML=H.fx.txt.length?'<div class="hint"><b>💡 Coup de pouce :</b> '+H.fx.txt.map(esc).join("<br>")+'</div>':"";
  $("co-"+ctx.p+q.id).innerHTML=(st.done||st.tries>=2)?'<div class="corr"><span class="ct">✔&#xFE0E; Corrigé</span><p>'+esc(q.corr)+'</p></div>':"";
  $("chk-"+ctx.p+q.id).textContent=st.done?"Vérifier à nouveau":"Vérifier";
}

function check(q,ctx){
  const st=ctx.st(q),E=evalQ(q,st.a);
  if(E.empty){lastFb[ctx.p+q.id]={empty:true,parts:E.parts};renderStatus(q,ctx);return;}

/* contrôles Lancer / Pause / Recommencer pour une progression 0→max */
function player(box,max,speed,onP,onEnd){
  const o={p:0,run:false};let lp=null;
  const bs=ctl(box,[["▶ Lancer",()=>{if(o.p>=max)o.p=0;if(RM){o.p=max;onP(o.p);end();return;}o.run=true;upd();lp=loop(dt=>{if(!o.run)return false;o.p=Math.min(max,o.p+dt*speed);onP(o.p);if(o.p>=max){o.run=false;end();upd();return false;}});}],["⏸ Pause",()=>{o.run=false;upd();}],["↺ Recommencer",()=>{o.run=false;o.p=0;onP(0);upd();}]]);

  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st.c[i]=!st.c[i];b.setAttribute("aria-pressed",String(!!st.c[i]));b.querySelector(".ck").textContent=st.c[i]?"✓":"";save();});
  const out=c.querySelector("#eo-"+e.id),show=()=>{out.innerHTML='<div class="corr"><span class="ct">✔&#xFE0E; Une réponse possible</span><p>'+esc(e.model)+'</p></div>';};
  c.querySelector("#em-"+e.id).onclick=()=>{if((st.t||"").trim().length<40){out.innerHTML='<div class="fb bad">Rédige d\'abord ta propre réponse (au moins deux phrases).</div>';return;}st.shown=true;save();show();};
  if(st.shown)show();}

/* ---------- réglages ---------- */
function applyFs(){const r=document.documentElement;r.classList.toggle("proj",!!S.proj);r.style.setProperty("--fs",(S.proj?Math.max(S.fs,30):S.fs)+"px");$("proj").setAttribute("aria-pressed",S.proj?"true":"false");}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme");}
$("fsMinus").onclick=()=>{S.fs=Math.max(20,S.fs-2);applyFs();save();};
$("fsPlus").onclick=()=>{S.fs=Math.min(34,S.fs+2);applyFs();save();};
$("proj").onclick=()=>{S.proj=!S.proj;applyFs();save();};
$("theme").onclick=()=>{const dark=S.theme?S.theme==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);S.theme=dark?"light":"dark";applyTheme();save();};

/* ---------- minuteur de séance (45 min, continue d'une étape à l'autre) ---------- */
const TM={left:TOTAL,run:false,last:0,iv:null};
function tDraw(){const s=Math.max(0,Math.ceil(TM.left)),c=$("tclock");c.textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2);c.className="tclock"+(s===0?" end":s<=300?" low":"");$("tPlay").textContent=TM.run?"⏸":"▶";$("tPlay").setAttribute("aria-label",TM.run?"Mettre le minuteur en pause":"Lancer le minuteur");}
function tStart(){if(TM.left<=0)TM.left=TOTAL;TM.run=true;TM.last=performance.now();clearInterval(TM.iv);TM.iv=setInterval(()=>{const n=performance.now();TM.left-=(n-TM.last)/1000;TM.last=n;if(TM.left<=0){TM.left=0;TM.run=false;clearInterval(TM.iv);}tDraw();},500);tDraw();}
function tStop(){TM.run=false;clearInterval(TM.iv);tDraw();}
$("tPlay").onclick=()=>{TM.run?tStop():tStart();};
$("tReset").onclick=()=>{tStop();TM.left=TOTAL;tDraw();};

/* ---------- routage ---------- */
function go(h){if(location.hash!=="#"+h)location.hash=h;else route();}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go]");if(t){e.preventDefault();go(t.dataset.go);}});
window.addEventListener("hashchange",route);
function route(){
  const h=(location.hash||"#home").slice(1);stopLoops();cleanup();curCtx=null;window.scrollTo(0,0);
  const i=STEPS.findIndex(s=>s.id===h);$("sbar").hidden=i<0;
  if(i>=0)viewStep(i);else if(h==="bilan")viewBilan();else viewHome();
}
function updScore(){const T=totals();$("sbScore").textContent=T.f+" / "+NQ;}

/* ---------- accueil ---------- */
function viewHome(){
  const T=totals();let nx=STEPS.findIndex(s=>scoreOf(s).t<scoreOf(s).n);if(nx<0)nx=NST-1;
  app.innerHTML='<section class="view"><div class="card stack"><div class="kicker">Ta mission</div>'+
   '<p>'+MISSION+'</p>'+
   '<p class="muted">Ton score compte la réponse au <b>premier essai</b>. Ensuite, tu peux utiliser les coups de pouce et corriger autant que tu veux.</p>'+
   '<div class="field"><label for="pname">Prénom ou numéro (facultatif, reste sur cet iPad)</label><input class="name" id="pname" autocomplete="off" maxlength="40" value="'+esc(S.name)+'"></div>'+
   '<div class="quick"><button class="btn" data-go="'+STEPS[nx].id+'">▶ '+(T.t?"Reprendre à l\'étape ":"Commencer : étape ")+(nx+1)+'</button><button class="btn ghost" data-go="bilan">📄 Mon bilan</button></div></div>'+
   '<div class="mission"><div class="mhead"><h3>Les '+NST+' étapes</h3><span class="muted small">environ '+DUREE+' minutes</span></div><div class="tiles">'+STEPS.map((s,i)=>{const r=scoreOf(s);
     return '<button class="tile'+(i===nx?" cur":"")+'" data-go="'+s.id+'"><span class="tn"><span>Étape '+(i+1)+'</span><span class="badge '+(r.t===r.n?(r.f===r.n?"full":"part"):r.t?"part":"")+'">'+(r.t?r.f+"/"+r.n:"à faire")+'</span></span><span class="tt">'+esc(s.t)+' · '+s.min+' min</span></button>';}).join("")+'</div></div></section>';
  $("pname").addEventListener("input",e=>{S.name=e.target.value;save();});
}

/* ---------- étape ---------- */
function viewStep(i){
  const s=STEPS[i];$("sbTitle").textContent="Étape "+(i+1)+" / "+NST;
  app.innerHTML='<section class="view"><div class="shead"><div class="kicker">Étape '+(i+1)+' sur '+NST+' · environ '+s.min+' minutes</div><h2 class="h2">'+esc(s.t)+'</h2></div>'+
   '<div class="box key"><div class="bt">🎯 Règle clé · Objectif</div><p>'+esc(s.goal)+'</p></div><div class="stack" id="host" style="gap:18px"></div><div id="endSlot"></div>'+
   '<div class="snav">'+(i>0?'<button class="btn ghost" data-go="'+STEPS[i-1].id+'">← Étape '+i+'</button>':'<button class="btn ghost" data-go="home">← Accueil</button>')+'<button class="btn" data-go="'+(i<NST-1?STEPS[i+1].id:"bilan")+'">'+(i<NST-1?"Étape "+(i+2)+" →":"Mon bilan →")+'</button></div></section>';
  const host=$("host");
  const ctx=curCtx={mode:"act",p:"",host,apis:{},st:q=>qst(q.id),save,after:(q,E)=>{if(E.ok)(ctx.apis[q.id]||[]).forEach(a=>a._s.forEach(f=>{try{f();}catch(e){}}));updStep(i);}};
  s.blocks.forEach(b=>{
    if(b.html){const d=document.createElement("div");d.className="stack";d.innerHTML=b.html;host.appendChild(d);}
    else if(b.an){const c=document.createElement("div");c.className="card";const an=document.createElement("div");an.className="anim";c.appendChild(an);host.appendChild(c);
      const api={solved:()=>b.qid?!!qst(b.qid).done:true,_s:[],onSolve(f){this._s.push(f);}};if(b.qid)(ctx.apis[b.qid]=ctx.apis[b.qid]||[]).push(api);
      try{ANIMS[b.an](an,api);}catch(e){console.error(e);an.innerHTML='<p class="anote">Animation indisponible.</p>';}}
    else if(b.essay)buildEssay(b.essay,host);
    else if(b.q)buildCard(b.q,ctx);});
  updStep(i);if(!TM.run&&TM.left===TOTAL)tStart();else tDraw();
}
function updStep(i){updScore();const s=STEPS[i],r=scoreOf(s),slot=$("endSlot");if(!slot)return;
  if(r.t<r.n){slot.innerHTML="";return;}
  slot.innerHTML='<div class="endcard" aria-live="polite"><div class="kicker" style="color:var(--band-muted)">Étape '+(i+1)+' terminée</div><div class="big">'+r.f+' / '+r.n+'</div><p>'+(r.f===r.n?"Tout juste au premier essai !":r.d===r.n?"Tout est corrigé : bien joué.":"Corrige les questions marquées ✗ avant de continuer, si tu as le temps.")+'</p></div>';
}

/* ---------- bilan ---------- */
function today(){const d=new Date();return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear();}
function attempted(){return QS.filter(q=>S.qs[q.id]&&S.qs[q.id].tries).length;}
function bilanText(){const T=totals(),L=[];
  L.push(TITRE_BILAN);L.push("Élève : "+(S.name.trim()||"non renseigné")+"   Date : "+today());L.push("");
  L.push("RÉSUMÉ DE L'ACTIVITÉ");STEPS.forEach((s,i)=>L.push("  Étape "+(i+1)+" · "+s.t+" — "+s.goal));L.push("");
  L.push("MON BILAN");L.push("  Score au premier essai : "+T.f+" / "+NQ+" ("+attempted()+" questions traitées sur "+NQ+")");
  STEPS.forEach((s,i)=>{const r=scoreOf(s);L.push("  Étape "+(i+1)+" : "+(r.t?r.f+" / "+r.n+(r.t<r.n?" (incomplète)":""):"non faite"));});
  const w=QS.filter(q=>{const st=S.qs[q.id];return st&&st.tries&&!st.first;}).map(q=>"étape "+q.sn+" « "+q.title+" »"+(S.qs[q.id].done?" (corrigée)":""));
  L.push("  Questions ratées au premier essai : "+(w.length?w.join(" ; "):"aucune"));
  ESSAYS.forEach(e=>{const v=(S.essay[e.id]||{}).t;if(v&&v.trim()){L.push("");L.push("MA RÉDACTION — "+e.title);L.push(v.trim());}});
  if(unlocked()){L.push("");L.push(LBL_BILAN.toUpperCase());CAHIER.forEach((c,i)=>L.push("  "+(i+1)+". "+c));}
  return L.join("\n");}
function unlocked(){return attempted()>=NQ-2||!!S.unlock;}
function viewBilan(){
  const T=totals(),ok=unlocked();
  app.innerHTML='<section class="view"><div class="shead"><div class="kicker">Fin de l\'activité</div><h2 class="h2">Mon bilan</h2></div>'+
   '<div class="card stack"><div class="field"><label for="pname">Prénom ou numéro (facultatif, reste sur cet iPad)</label><input class="name" id="pname" autocomplete="off" maxlength="40" value="'+esc(S.name)+'"></div>'+
   '<div class="stats"><div class="stat"><div class="k">Réussies au 1er essai</div><div class="v">'+T.f+' / '+NQ+'</div></div><div class="stat"><div class="k">Questions traitées</div><div class="v">'+attempted()+' / '+NQ+'</div></div>'+STEPS.map((s,i)=>{const r=scoreOf(s);return '<div class="stat"><div class="k">Étape '+(i+1)+'</div><div class="v">'+(r.t?r.f+" / "+r.n:"—")+'</div></div>';}).join("")+'</div></div>'+
   (ok?'<div class="box key"><div class="bt">✏️ Règle clé · '+esc(LBL_BILAN)+'</div><p><b>'+esc(TITRE_CAHIER)+'</b></p><ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px">'+CAHIER.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ol></div>'
      :'<div class="box warn"><div class="bt">⚠︎ Vigilance · '+esc(LBL_BILAN)+'</div><p>Il s\'affichera quand tu auras traité presque toutes les questions ('+attempted()+' / '+NQ+' pour l\'instant).</p><div><button class="btn ghost sm" id="unl">Mon professeur m\'autorise à l\'afficher</button></div></div>')+
   '<div class="card stack"><div class="kicker">Exporter</div><div class="bilantext" id="bilanText"></div><div class="row"><button class="btn" id="dlB" hidden>⬇ Exporter mon résumé et mon bilan (.txt)</button><button class="btn ghost" id="cpB">Copier</button><button class="btn ghost" id="bProf">Montrer au professeur</button></div><p class="muted" id="bMsg" aria-live="polite"></p></div>'+
   '<div class="row"><button class="btn ghost" data-go="home">← Accueil</button><button class="btn ghost" id="rst">Tout recommencer</button></div></section>';
  $("bilanText").textContent=bilanText();
  $("pname").addEventListener("input",e=>{S.name=e.target.value;save();$("bilanText").textContent=bilanText();});
  if($("unl"))$("unl").onclick=()=>{S.unlock=true;save();viewBilan();};
  $("cpB").onclick=()=>{const t=bilanText(),msg=$("bMsg");const sel=()=>{const r=document.createRange();r.selectNodeContents($("bilanText"));const g=getSelection();g.removeAllRanges();g.addRange(r);msg.textContent="Le texte est sélectionné : copie-le avec ton iPad.";};try{navigator.clipboard.writeText(t).then(()=>{msg.textContent="Bilan copié.";},sel);}catch(e){sel();}};
  if(DL)$("dlB").hidden=false;
  $("dlB").onclick=()=>{if(!DL)return;const msg=$("bMsg"),nm=(S.name.trim()||"eleve").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_-]+/g,"-").slice(0,30)||"eleve";
    DL.save({filename:FICHIER+nm+".txt",data:bilanText()}).then(()=>{msg.textContent="Fichier téléchargé.";},()=>{msg.textContent="Téléchargement impossible ici : utilise « Copier ».";});};
  $("bProf").onclick=()=>{$("ovkick").textContent="Bilan à montrer au professeur";$("ovname").textContent=S.name.trim()||"Élève";$("ovsub").textContent=TITRE_COURT+" · score au premier essai";$("ovtot").textContent=T.f+" / "+NQ;
    $("ovlist").innerHTML=STEPS.map((s,i)=>{const r=scoreOf(s);return '<div class="ovitem">Étape '+(i+1)+'<div style="font-family:var(--f-num)">'+(r.t?r.f+" / "+r.n:"—")+'</div></div>';}).join("");$("overlay").hidden=false;$("ovClose").focus();};
  let arm=false;$("rst").onclick=()=>{if(!arm){arm=true;$("rst").textContent="Confirmer : effacer mes réponses";return;}S.qs={};S.essay={};S.unlock=false;save();TM.left=TOTAL;tStop();go("home");};
}
$("ovClose").onclick=()=>{$("overlay").hidden=true;};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("overlay").hidden=true;});
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(d=>{DL=d;const b=$("dlB");if(b&&d)b.hidden=false;}).catch(()=>{});}catch(e){}

applyFs();applyTheme();tDraw();route();
window.__t={S:()=>S,STEPS,QS,evalQ,QBY,go};

})();
</script>
<footer data-signature style="text-align:center;font-size:.8rem;opacity:.75;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">Mr Moreira · Vauban Luxembourg</footer>
</body>
