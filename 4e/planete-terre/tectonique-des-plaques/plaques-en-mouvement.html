<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout : bandeau SVT vert foncé ; vues Sommaire (missions → tuiles de séances), Séance (barre collante avec minuteur, 4 cartes-questions dont le document animé), Révision, Progression, Bilan ; colonne 980 px (1400 px en projection) */
:root{
  --bg:#eff4f1; --surface:#ffffff; --surface-2:#e3ede7; --ink:#0f2d36; --muted:#46626c; --line:#bfd2d4;
  --teal:#1f6b45; --teal-ink:#ffffff; --teal-soft:#dbeee2;
  --band:#123d2a; --band-ink:#eaf5ee; --band-muted:#a8cdb5;
  --ok:#17703c; --ok-soft:#dcf1e3; --bad:#b3261e; --bad-soft:#fbe2df;
  --info:#1d5fa8; --info-soft:#e4eefb; --warn:#a14f00; --warn-soft:#fdebd6; --key:#17703c; --key-soft:#dcf1e3;
  --t-r6:#6a3fa0; --t-sp:#0b6170; --t-se:#a14f00; --t-doc:#1d5fa8;
  --sky:#0e1a2b; --sun:#f2b705; --sunglow:rgba(242,183,5,.35); --water:#4b9fd6; --water-2:#2f7fb5; --ice:#cfe8f7;
  --blood:#c62828; --blood-2:#6d4c8a; --leaf:#3f8f3a; --leaf-2:#8cc66b; --bark:#8a5a2b; --soil:#7a5536;
  --org:#d9822b; --bact:#cf5d17; --nerve:#e0b100; --muscle:#d9665b; --bone:#e9e2cf; --skin:#f1c9a5;
  --metal:#7d8d93; --wire:#37474f; --lamp:#ffd54f; --iodine-b:#1b1d4a; --iodine-y:#c9a227; --lava:#e65100; --rock:#4e4a47; --rock-l:#c9bfae;
  --paper:#fffdf6; --o2:#1d5fa8; --co2:#7a6b5d; --glu:#d39b00;
  --f-display:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:22px; --maxw:980px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b171b; --surface:#12242a; --surface-2:#1a3138; --ink:#e4eff1; --muted:#a3bac1; --line:#2f4a52;
  --teal:#6fcf97; --teal-ink:#06261a; --teal-soft:#173a28;
  --band:#0b2a1c; --band-ink:#e4f2ea; --band-muted:#93c2a6;
  --ok:#66d695; --ok-soft:#173826; --bad:#ff8f84; --bad-soft:#3d1c1a;
  --info:#8ab8f2; --info-soft:#15263b; --warn:#f3a95c; --warn-soft:#352310; --key:#66d695; --key-soft:#173826;
  --t-r6:#c2a6f2; --t-sp:#5cc6d3; --t-se:#f3a95c; --t-doc:#8ab8f2;
  --sky:#050b14; --water:#3d8fc0; --water-2:#2a6f9e; --ice:#9fc6de; --blood:#ef5350; --blood-2:#9575cd; --leaf:#5cae55; --leaf-2:#9fd17f; --bark:#b07a44; --soil:#9b7350;
  --metal:#9aaab0; --wire:#b0bec5; --bone:#d8d0bb; --rock:#8a8580; --rock-l:#d8cfbf; --paper:#1d2a22; --o2:#8ab8f2; --co2:#b6a898;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b171b; --surface:#12242a; --surface-2:#1a3138; --ink:#e4eff1; --muted:#a3bac1; --line:#2f4a52;
  --teal:#6fcf97; --teal-ink:#06261a; --teal-soft:#173a28;
  --band:#0b2a1c; --band-ink:#e4f2ea; --band-muted:#93c2a6;
  --ok:#66d695; --ok-soft:#173826; --bad:#ff8f84; --bad-soft:#3d1c1a;
  --info:#8ab8f2; --info-soft:#15263b; --warn:#f3a95c; --warn-soft:#352310; --key:#66d695; --key-soft:#173826;
  --t-r6:#c2a6f2; --t-sp:#5cc6d3; --t-se:#f3a95c; --t-doc:#8ab8f2;
  --sky:#050b14; --water:#3d8fc0; --water-2:#2a6f9e; --ice:#9fc6de; --blood:#ef5350; --blood-2:#9575cd; --leaf:#5cae55; --leaf-2:#9fd17f; --bark:#b07a44; --soil:#9b7350;
  --metal:#9aaab0; --wire:#b0bec5; --bone:#d8d0bb; --rock:#8a8580; --rock-l:#d8cfbf; --paper:#1d2a22; --o2:#8ab8f2; --co2:#b6a898;
  color-scheme:dark;
}
html{font-size:var(--fs)}
html.proj{--maxw:1400px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:16px 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--band-muted)}
.band h1{font-size:clamp(1.4rem,4.4vw,2.1rem);font-weight:800;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{min-height:48px;min-width:48px;padding:0 12px;border-radius:12px;border:1.5px solid color-mix(in oklab,var(--band-ink) 35%,transparent);background:transparent;color:var(--band-ink);font-weight:700;cursor:pointer;font-size:.9rem}
.tbtn[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

main .wrap{padding-block:22px 64px}
section.view{display:flex;flex-direction:column;gap:20px}
.kicker{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.h2{font-size:clamp(1.3rem,3.4vw,1.75rem);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--teal);background:var(--teal);color:var(--teal-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn{max-width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.weak .btn{white-space:normal;justify-content:flex-start;text-align:left;padding-block:8px}
@media (max-width:560px){.hl{display:none}.sbar .ttl{font-size:.95rem}.sbar .wrap{gap:6px 8px}}
.btn.sm{min-height:48px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}

.box{border-radius:14px;padding:12px 16px;border-left:6px solid;display:flex;flex-direction:column;gap:6px;min-width:0}
.box .bt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.box.info{background:var(--info-soft);border-color:var(--info)}.box.info .bt{color:var(--info)}
.box.warn{background:var(--warn-soft);border-color:var(--warn)}.box.warn .bt{color:var(--warn)}
.box.key{background:var(--key-soft);border-color:var(--key)}.box.key .bt{color:var(--key)}

/* Sommaire */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:.9rem;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-num);font-weight:700;font-size:1.25rem}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.mission{display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.mhead h3{font-size:1.1rem;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.tile{min-height:96px;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tn{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.tile .tt{font-size:.9rem;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{font-family:var(--f-num);font-size:.9rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap}
.badge.full{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.badge.part{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tile.cur{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}

/* Séance */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-block:6px}
.sbar .ttl{font-weight:800;min-width:0}
.timer{display:flex;align-items:center;gap:6px}
.tclock{font-family:var(--f-num);font-weight:700;font-size:1.15rem;min-width:4.2ch;text-align:center;padding:4px 10px;border-radius:10px;background:var(--surface-2)}
.tclock.low{background:var(--warn-soft);color:var(--warn)}
.tclock.end{background:var(--bad-soft);color:var(--bad)}
.ibtn{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.sco{font-family:var(--f-num);font-weight:700;padding:4px 10px;border-radius:10px;background:var(--teal-soft)}
.shead{display:flex;flex-direction:column;gap:4px}
.snav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:80px}
.qhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.qnum{font-family:var(--f-num);font-weight:800;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--teal-ink);flex:none}
.tag{font-size:.9rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor;display:inline-block;max-width:100%}
.tag.r6{color:var(--t-r6)}.tag.sp{color:var(--t-sp)}.tag.se{color:var(--t-se)}.tag.doc{color:var(--t-doc)}
a.tag{text-decoration:none}
.qstat{margin-left:auto;font-size:.9rem;font-weight:700;color:var(--muted)}
.qstat.ok{color:var(--ok)}.qstat.bad{color:var(--bad)}
.qtext{font-weight:700;font-size:1.05rem}
.ins{font-size:.9rem;color:var(--muted)}
.part{display:flex;flex-direction:column;gap:8px;min-width:0}
.part+.part{border-top:1px dashed var(--line);padding-top:12px}
.pq{font-weight:700}
.fields{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.grow{flex:1 1 260px}
.field label{font-size:.9rem;font-weight:700;color:var(--muted)}
.inp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input.ans{min-height:52px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1rem;min-width:0;width:100%}
input.ans.num{width:8ch;font-family:var(--f-num);font-weight:700}
input.ans.good{border-color:var(--ok);background:var(--ok-soft)}
input.ans.badi{border-color:var(--bad);background:var(--bad-soft)}
.mk{font-weight:700;font-size:.9rem;white-space:nowrap}
.mk.ok{color:var(--ok)}.mk.bad{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between}
.opt .ck{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.9rem;font-weight:800}
.opt.radio .ck{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.opt[aria-pressed="true"] .ck{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.opt.okm{border-color:var(--ok);background:var(--ok-soft)}
.opt.badm{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.35;text-decoration:line-through;pointer-events:none}
.ordbox{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:12px;border:2px dashed var(--line);background:var(--bg);align-items:center}
.ordbox.okb{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.ordbox.badb{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.chipw{min-height:48px;padding:0 14px;border-radius:999px;border:2px solid var(--teal);background:var(--surface);font-weight:700;cursor:pointer}
.chipw.placed{background:var(--teal-soft)}
.chipw .no{font-family:var(--f-num);margin-right:6px;color:var(--teal)}
.chipw:disabled{border-color:var(--line);color:var(--muted);opacity:.5}
.mrow{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.mrow .rl{font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qbtns{display:flex;flex-wrap:wrap;gap:10px}
.fb{border-radius:12px;padding:10px 14px}
.fb.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.hint{background:var(--warn-soft);border-radius:12px;padding:10px 14px}
.hint b{color:var(--warn)}
.corr{border-left:5px solid var(--key);background:var(--key-soft);border-radius:0 12px 12px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.corr .ct{font-weight:700;color:var(--key)}

/* Document animé */
.doc{display:flex;flex-direction:column;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px;min-width:0}
.dcap{font-style:italic;color:var(--muted)}
.anim{display:flex;flex-direction:column;gap:10px;min-width:0}
.anim .stage-wrap{background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden;min-width:0}
svg.stg{display:block;width:100%;height:auto;font-family:var(--f-body)}
svg.stg text{fill:var(--ink);font-size:18px}
svg.stg text.m{fill:var(--muted)}
svg.stg text.b{font-weight:700}
svg.stg text.w{fill:#fff}
svg.stg .tk{stroke:var(--ink);stroke-width:2}
svg.stg .ln{stroke:var(--line);stroke-width:1}
.actl{display:flex;flex-wrap:wrap;gap:8px}
.anote{font-size:.9rem;color:var(--muted)}
.alive{min-height:1.5em;font-weight:700;color:var(--teal)}
.simtag{align-self:flex-start;font-size:.9rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 10px;border-radius:999px}
.dtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:10px;overflow:hidden}
.dtable th,.dtable td{padding:7px 10px;border:1px solid var(--line);text-align:left;font-size:.95rem}
.dtable th{background:var(--teal-soft)}
.tscroll{overflow-x:auto;border-radius:10px}
.endcard{background:var(--band);color:var(--band-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.endcard .big{font-family:var(--f-num);font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem)}
.endcard .muted{color:var(--band-muted)}
.endcard .btn.ghost{color:var(--band-ink);border-color:var(--band-muted)}

/* Progression / bilan */
.pbar{display:flex;flex-direction:column;gap:6px}
.pbar .pl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.track{height:16px;border-radius:8px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.track span{display:block;height:100%;background:var(--ok)}
.weak{display:flex;flex-direction:column;gap:8px}
.weak button{text-align:left}
.bilantext{white-space:pre-wrap;font-family:var(--f-num);font-size:.9rem;background:var(--surface-2);border-radius:12px;padding:14px;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
input.name{min-height:52px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);width:min(100%,16em)}
.overlay{position:fixed;inset:0;z-index:20;background:var(--surface);overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovin{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ovname{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3.6rem)}
.ovtot{font-family:var(--f-num);font-weight:700;font-size:clamp(2.6rem,11vw,5.4rem);color:var(--teal);line-height:1}
.ovlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.ovitem{background:var(--surface-2);border-radius:12px;padding:12px;font-size:1.2rem;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* Hébergement classique (GitHub Pages) : le bilan se télécharge comme un fichier .txt */
(function(){
  if(window.claude) return;
  function save(o){
    return new Promise(function(res,rej){
      try{
        var txt=(o&&o.data!=null)?String(o.data):"";
        var blob=new Blob(["\ufeff"+txt],{type:"text/plain;charset=utf-8"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=(o&&o.filename)||"bilan.txt"; a.style.display="none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(url); a.remove();},15000);
        res();
      }catch(e){ rej({code:"failed"}); }
    });
  }
  window.claude={use:function(name){
    return name==="downloads" ? Promise.resolve({save:save}) : Promise.reject(new Error("indisponible"));
  }};
})();
</script>

<body>
<header class="band" id="band">
  <div class="wrap">
    <div style="min-width:0">
      <div class="eyebrow">4e SVT · La planète Terre · 45 minutes</div>
      <h1>Plaques en mouvement</h1>
    </div>
    <div class="tools" role="group" aria-label="Affichage">

(function(){
"use strict";
/* ===================== CONTENU · Plaques en mouvement (4e) ===================== */

const W=(a,s,x)=>Object.assign({t:"txt",a,s},x||{});
const F=(...f)=>({t:"txtf",f:f.map(x=>({l:x[0],a:x[1],s:x[2]}))});
const N=(...f)=>({t:"num",f:f.map(x=>({l:x[0],u:x[1],v:x[2],tol:x[3]||0,alt:x[4]}))});
const O=(...o)=>({t:"order",o});
const R=(r,c,a)=>({t:"match",r,c,a});
const C=(h,...parts)=>({t:"parts",h,parts:parts.map(p=>Object.assign({q:p[0]},p[1]))});
/* question : id, niveau (f/m/d), intitulé, énoncé, réponse attendue, corrigé affiché */
const Q=(id,lv,title,text,spec,corr)=>({q:{id,lv,title,text,spec,corr}});
const H=html=>({html});
const A=(an,qid)=>({an,qid});

const STEPS=[
{id:"e1",t:"Où la Terre tremble-t-elle ?",min:6,goal:"Repérer où se produisent les séismes et les éruptions volcaniques.",blocks:[

]},
{id:"e2",t:"Une idée qui a mis 80 ans à s'imposer",min:9,goal:"Retrouver les découvertes qui ont construit le modèle de la tectonique des plaques.",blocks:[
  H('<p>En <b>1912</b>, le météorologue allemand Alfred Wegener observe une carte du monde. Une idée lui vient… Remonte le temps avec le curseur.</p>'),

    C("Il y a deux bonnes réponses : l'une concerne la forme, l'autre ce que l'on trouve dans les roches.",["",X(2,"Leurs côtes s'emboîtent comme les pièces d'un puzzle.","On trouve les mêmes fossiles et les mêmes roches anciennes des deux côtés de l'océan.","Les deux continents ont aujourd'hui le même climat.","Les deux continents ont la même superficie.")]),

  H('<p>Wegener ne peut pas mesurer ce déplacement. Depuis <b>1990</b>, le système de satellites <b>DORIS</b> le fait en temps réel.</p>'),

  Q("e2b","m","Calculer","L'Amérique et l'Europe s'éloignent d'environ 2 cm par an. De combien de kilomètres s'éloignent-elles en 1 million d'années ?",
    C("Calcule d'abord la distance en centimètres, puis convertis : 1 km = 100 000 cm.",["",N(["Distance","km",20,0,[[2000000,"2 000 000, c'est la distance en centimètres. Convertis en kilomètres : 1 km = 100 000 cm."],[2000,"Vérifie ta conversion : 1 km = 100 000 cm."],[20000,"20 000, c'est la distance en mètres. Convertis en kilomètres."],[2,"N'oublie pas de multiplier par 1 000 000 années."]]])]),

]},
{id:"e3",t:"Sous nos pieds : la plaque en profondeur",min:10,goal:"Délimiter une plaque en profondeur grâce aux ondes sismiques.",blocks:[
  H('<p>Personne n\'a jamais creusé à 100 km de profondeur. Pour « voir » l\'intérieur de la Terre, les géologues suivent les <b>ondes sismiques</b> : leur vitesse dépend des roches traversées.</p><div class="box info"><div class="bt">ℹ︎ Contenu · À savoir</div><p>Plus une roche est <b>rigide</b>, plus les ondes y vont vite. Si la vitesse diminue, c\'est que la roche devient moins rigide.</p></div>'),

    "Les ondes ralentissent à partir de 100 km sous les océans et de 150 km sous les continents."),
  Q("e3c","m","Expliquer","Le manteau est fait de la même roche (la péridotite) à 50 km et à 200 km. Pourquoi les ondes ralentissent-elles alors en profondeur ?",
    C("Relis l'encadré bleu : de quoi dépend la vitesse des ondes ?",["",M("Parce que la roche y est moins rigide (plus ductile).","Parce que la roche change de nature.","Parce qu'il n'y a plus de roche, seulement du vide.","Parce que les ondes sont fatiguées par la distance.")]),
    "La roche est la même, mais elle est moins rigide (plus ductile) en profondeur : les ondes y sont ralenties."),
  Q("e3d","d","Nommer les deux couches","Complète avec les mots : lithosphère, asthénosphère.",
    C("« Lithos » signifie pierre en grec ; « asthenos » signifie sans résistance.",["",F(["Couche rigide du dessus, qui forme la plaque","lithosph","la lithosphère"],["Couche moins rigide du dessous, sur laquelle la plaque repose","asthenosph","l'asthénosphère"])]),
    "Une plaque est faite de lithosphère, rigide, épaisse d'environ 100 km sous les océans et 150 km sous les continents. Elle repose sur l'asthénosphère, moins rigide.")
]},
{id:"e4",t:"Aux frontières des plaques",min:12,goal:"Relier les mouvements des plaques aux reliefs, aux séismes et aux volcans.",blocks:[
  H('<p>Les plaques rigides se déplacent les unes par rapport aux autres. À leurs frontières, trois situations sont possibles. Lance chaque animation et observe : le <b>mouvement</b>, le <b>relief</b> formé, les <b>séismes</b> et le <b>volcanisme</b>.</p>'),
  A("boundaries"),
  Q("e4a","m","Mouvement et relief","Associe chaque relief au mouvement des plaques qui le forme.",
    C("Divergence : les plaques s'écartent. Convergence : elles se rapprochent.",["",R(["Dorsale océanique","Fosse océanique","Chaîne de montagnes"],["Divergence","Convergence · subduction","Convergence · collision"],[0,1,2])]),
    "Dorsale : divergence. Fosse océanique : convergence avec subduction. Chaîne de montagnes : convergence avec collision de deux continents."),
  Q("e4b","m","Le volcanisme","Quel type de volcanisme trouve-t-on dans chaque zone ?",
    C("Effusif : des coulées de lave fluide. Explosif : des explosions, des cendres, des nuées.",["",R(["Au niveau d'une dorsale","Au-dessus d'une zone de subduction"],["Volcanisme effusif","Volcanisme explosif"],[0,1])]),
    "Dorsale : volcanisme effusif, qui fabrique le nouveau plancher océanique. Subduction : volcanisme explosif (comme autour du Pacifique)."),
  Q("e4c","d","La subduction","Remets dans l'ordre ce qui se passe dans une zone de subduction.",
    C("Tout commence loin de la fosse, là où la plaque est fabriquée.",["",O("La plaque océanique s'éloigne de la dorsale, se refroidit et devient plus dense.","Elle rencontre une plaque continentale, moins dense.","Elle plonge sous le continent : une fosse se creuse.","Des séismes se produisent et des volcans explosifs apparaissent.")]),
    "En s'éloignant de la dorsale, la plaque océanique se refroidit et devient plus dense. Elle plonge sous la plaque continentale, moins dense : c'est la subduction, qui crée une fosse, des séismes et un volcanisme explosif.")
]},
{id:"e5",t:"Le moteur des plaques",min:6,goal:"Expliquer l'origine du mouvement des plaques.",blocks:[
  H('<p>Qu\'est-ce qui met en mouvement des plaques de 100 km d\'épaisseur ? Règle la <b>chaleur interne</b> de la Terre et observe.</p>'),
  A("engine"),
  Q("e5a","f","L'origine de l'énergie","D'où vient l'énergie qui met les plaques en mouvement ?",
    C("L'animation montre d'où part la chaleur.",["",M("De la chaleur interne de la Terre, produite par la désintégration d'éléments radioactifs contenus dans les roches.","De la chaleur du Soleil, qui réchauffe la surface.","Du vent et des courants marins.","De l'attraction de la Lune.")]),
    "Les mouvements des plaques sont dus à la dissipation de la chaleur interne de la Terre, produite par la désintégration d'éléments radioactifs contenus dans les roches."),
  Q("e5b","d","Remonter le temps","Une plaque se déplace de 5 cm par an. Quelle distance a-t-elle parcourue en 10 millions d'années ?",
    C("5 cm × 10 000 000 donne des centimètres. Puis 1 km = 100 000 cm.",["",N(["Distance","km",500,0,[[50000000,"50 000 000, c'est la distance en centimètres. Convertis en kilomètres."],[50,"Vérifie : 10 millions s'écrit 10 000 000."],[5000,"Vérifie ta conversion : 1 km = 100 000 cm."]]])]),
    "5 cm × 10 000 000 = 50 000 000 cm = 500 km : assez pour ouvrir un océan ou fermer une mer.")
]}
];

/* bilan à recopier dans le cahier */
const CAHIER=[
 "La surface de la Terre est découpée en plaques tectoniques. Les séismes et les volcans sont alignés à leurs frontières.",
 "Une plaque est faite de lithosphère, une couche de roche rigide épaisse d'environ 100 km (sous les océans) à 150 km (sous les continents). Elle repose sur l'asthénosphère, moins rigide.",
 "Les plaques se déplacent de quelques centimètres par an. Elles s'écartent au niveau des dorsales (divergence, volcanisme effusif) et se rapprochent dans les zones de subduction (fosses, volcanisme explosif) et de collision (chaînes de montagnes).",
 "Ces mouvements sont dus à la chaleur interne de la Terre, produite par la désintégration d'éléments radioactifs contenus dans les roches."
];

/* ===================== MOTEUR ===================== */
const KEY="tectonique-4e-v1";
const $=id=>document.getElementById(id);
const RM=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const frn=(x,d)=>Number(x).toLocaleString("fr-FR",{maximumFractionDigits:d==null?2:d,minimumFractionDigits:0});
const DEF={name:"",fs:22,proj:false,theme:null,qs:{},box:{},last:{},lastSn:0};
let S;
try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){S=JSON.parse(JSON.stringify(DEF));}
["qs","box","last"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={};});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function qst(id){return S.qs[id]||(S.qs[id]={a:{},tries:0,hints:0});}

/* ---------- données ---------- */
function norm(sp){return sp.t==="parts"?sp:{t:"parts",h:sp.h,parts:[sp]};}
const QS=[];STEPS.forEach((s,si)=>s.blocks.forEach(b=>{if(b.q){const q=b.q;q.spec=norm(q.spec);q.sn=si+1;q.tagRaw="";q.tc={f:"sp",m:"se",d:"r6"}[q.lv];q.tl={f:"🟢 Facile",m:"🟡 Moyen",d:"🔴 Défi"}[q.lv];QS.push(q);}}));
const QBY={};QS.forEach((q,i)=>{q.k=i+1;QBY[q.id]=q;});
function nz(s){return String(s==null?"":s).toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/₂/g,"2").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let p=new Array(n+1);for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function has(t,alts,exact){const T=" "+t+" ",toks=t.split(" ");return alts.split("|").some(st=>{st=nz(st);if(!st)return false;if(T.indexOf(" "+st)>=0)return true;
  if(!exact&&st.indexOf(" ")<0&&st.length>=5){const tol=st.length>=9?2:1;return toks.some(w=>w.length>=st.length-1&&lev(w.slice(0,st.length),st)<=tol);}return false;});}
function parseNum(s){const t=String(s==null?"":s).trim().replace(/\s/g,"").replace(/[−–]/g,"-").replace(",",".");return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):null;}

/* ---------- mélange déterministe ---------- */
function seedOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function perm(n,seed){const a=[...Array(n).keys()];let x=seed||1;for(let i=n-1;i>0;i--){x=(Math.imul(x,1103515245)+12345)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  if(n>1&&a.every((v,i)=>v===i)){a.push(a.shift());}return a;}

/* ---------- évaluation ---------- */
function evalPart(p,a){
  switch(p.t){
    case "txt":{const t=nz(a);if(!t)return {empty:true};
      if(p.bad&&has(t,p.bad,true))return {ok:false};
      if(p.p){const f=p.p.filter(x=>has(t,x)).length;return {ok:f>=p.n,found:f};}
      const al=Array.isArray(p.a)?p.a:[p.a];return {ok:al.every(x=>has(t,x))};}
    case "txtf":{const v=a||[];if(p.f.some((f,i)=>!nz(v[i])))return {empty:true};const m=p.f.map((f,i)=>{const t=nz(v[i]);const al=Array.isArray(f.a)?f.a:[f.a];return al.every(x=>has(t,x));});return {ok:m.every(Boolean),m};}
    case "mcq":{if(a==null)return {empty:true};return {ok:a===0};}
    case "multi":{const v=a||[];if(!v.length)return {empty:true};const wrong=v.some(i=>i>=p.k),good=v.filter(i=>i<p.k).length;return {ok:!wrong&&(p.min?good>=p.min:good===p.k)};}
    case "num":{const v=a||[];const x=p.f.map((f,i)=>parseNum(v[i]));if(x.some(y=>y===null))return {empty:true};const m=p.f.map((f,i)=>Math.abs(x[i]-f.v)<=f.tol+1e-9);
      let msg="";p.f.forEach((f,i)=>{if(!m[i]&&f.alt&&f.alt.some(z=>Math.abs(x[i]-z[0])<1e-9))msg=f.alt.find(z=>Math.abs(x[i]-z[0])<1e-9)[1];});return {ok:m.every(Boolean),m,msg};}
    case "order":{const v=a||[];if(v.length<p.o.length)return {empty:true};const m=v.map((x,i)=>x===i);return {ok:m.every(Boolean),m};}
    case "match":{const v=a||[];if(p.r.some((r,i)=>v[i]==null))return {empty:true};const m=p.r.map((r,i)=>v[i]===p.a[i]);return {ok:m.every(Boolean),m};}
  }
  return {ok:false};
}
function evalQ(q,ans){const rs=q.spec.parts.map((p,i)=>evalPart(p,ans[i]));return {parts:rs,empty:rs.some(r=>r.empty),ok:rs.every(r=>r.ok)};}

/* ---------- coups de pouce ---------- */
const ART=/^(le |la |les |l'|l’|un |une |des |du |de la |de l'|d'|en |dans |au |aux |par |se |sa |son |ses )+/i;
function words(s){return String(s).split(/\s*,\s*|\s+et\s+|\s*;\s*/).map(w=>w.replace(ART,"").replace(/\(.*?\)/g,"").replace(/…/g,"").trim()).filter(Boolean);}
function txtHint(s,L){const w=words(s);if(L===1)return "Commence par « "+w.map(x=>x[0].toUpperCase()+"…").join(" », « ")+" ».";return w.map(x=>"« "+x.slice(0,Math.max(2,Math.ceil(x.length/2)))+"… » ("+x.replace(/[\s’'-]/g,"").length+" lettres)").join(" ; ");}
function wrongOrder(q,pi,p){return perm(p.o.length,seedOf(q.id+"w"+pi)).filter(i=>i>=(p.t==="multi"?p.k:1));}
function hintFx(q,L){ // effets cumulés pour le niveau L
  const fx={txt:[],gone:{},ord:{},mt:{}};const sp=q.spec;const steps=[];
  if(sp.h)steps.push({h:sp.h});steps.push({lv:1});steps.push({lv:2});
  for(let s=0;s<Math.min(L,steps.length);s++){const st=steps[s];
    if(st.h){fx.txt.push(st.h);continue;}
    sp.parts.forEach((p,pi)=>{const pre=sp.parts.length>1?"Partie "+(pi+1)+" : ":"";const lv=st.lv;
      if(p.t==="txt"){fx.txt.push(pre+(p.h&&lv===1?p.h:txtHint(p.s,lv)));}
      else if(p.t==="txtf"){p.f.forEach(f=>fx.txt.push(pre+f.l+" — "+txtHint(f.s,lv)));}
      else if(p.t==="mcq"){const n=Math.min(lv,p.o.length-2);if(n>0){fx.gone[pi]=n;fx.txt.push(pre+(n>1?n+" mauvaises réponses sont barrées.":"Une mauvaise réponse est barrée."));}else fx.txt.push(pre+"Relis bien la question et le document : une seule réponse est juste.");}
      else if(p.t==="multi"){if(lv===1)fx.txt.push(pre+"Il y a "+p.k+" bonne"+(p.k>1?"s":"")+" réponse"+(p.k>1?"s":"")+(p.min?" (il en faut au moins "+p.min+")":"")+".");else{fx.gone[pi]=1;fx.txt.push(pre+"Une mauvaise réponse est barrée.");}}
      else if(p.t==="num"){if(lv===1)fx.txt.push(pre+(p.h||"Relis le document et pose le calcul dans ton cahier."));else p.f.forEach(f=>{const d=Math.max(1,Math.abs(f.v)*.25);fx.txt.push(pre+f.l+" : entre "+frn(Math.floor(f.v-d))+" et "+frn(Math.ceil(f.v+d))+(f.u?" "+f.u:"")+".");});}
      else if(p.t==="order"){fx.ord[pi]=Math.min(lv,p.o.length-1);fx.txt.push(pre+"Début de l'ordre : "+p.o.slice(0,fx.ord[pi]).join(" → ")+" → …");}
      else if(p.t==="match"){fx.mt[pi]=Math.min(lv,p.r.length-1);for(let r=0;r<fx.mt[pi];r++)fx.txt.push(pre+"« "+p.r[r]+" » → « "+p.c[p.a[r]]+" »");}
    });
  }
  return {fx,max:steps.length};
}

/* ---------- carte-question ---------- */
const lastFb={};
const LETTERS="ABCDEFGH";
function insOf(p){return {txt:p.p?"Tape ta réponse (sépare les éléments par des virgules).":"Tape ta réponse.",txtf:"Tape tes réponses.",mcq:"Choisis la bonne réponse.",multi:p.min?"Coche au moins "+p.min+" bonnes réponses (et aucune fausse).":"Coche toutes les bonnes réponses.",num:"Tape un nombre.",order:"Touche les étiquettes dans le bon ordre (touche une étiquette placée pour la retirer).",match:"Pour chaque ligne, choisis la bonne réponse."}[p.t];}
function buildCard(q,ctx){
  const st=ctx.st(q),c=document.createElement("article");c.className="qcard";c.id="card-"+q.id;

  $("pname").addEventListener("input",e=>{S.name=e.target.value;save();$("bilanText").textContent=bilanText();});
  if($("unl"))$("unl").onclick=()=>{S.unlock=true;save();viewBilan();};
  $("cpB").onclick=()=>{const t=bilanText(),msg=$("bMsg");const sel=()=>{const r=document.createRange();r.selectNodeContents($("bilanText"));const g=getSelection();g.removeAllRanges();g.addRange(r);msg.textContent="Le texte est sélectionné : copie-le avec ton iPad.";};try{navigator.clipboard.writeText(t).then(()=>{msg.textContent="Bilan copié.";},sel);}catch(e){sel();}};
  if(DL)$("dlB").hidden=false;
  $("dlB").onclick=()=>{if(!DL)return;const msg=$("bMsg"),nm=(S.name.trim()||"eleve").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_-]+/g,"-").slice(0,30)||"eleve";
    DL.save({filename:"bilan-plaques-"+nm+".txt",data:bilanText()}).then(()=>{msg.textContent="Fichier téléchargé.";},()=>{msg.textContent="Téléchargement impossible ici : utilise « Copier ».";});};
  $("bProf").onclick=()=>{$("ovkick").textContent="Bilan à montrer au professeur";$("ovname").textContent=S.name.trim()||"Élève";$("ovsub").textContent="Plaques en mouvement · score au premier essai";$("ovtot").textContent=T.f+" / "+NQ;
    $("ovlist").innerHTML=STEPS.map((s,i)=>{const r=scoreOf(s);return '<div class="ovitem">Étape '+(i+1)+'<div style="font-family:var(--f-num)">'+(r.t?r.f+" / "+r.n:"—")+'</div></div>';}).join("");$("overlay").hidden=false;$("ovClose").focus();};
  let arm=false;$("rst").onclick=()=>{if(!arm){arm=true;$("rst").textContent="Confirmer : effacer mes réponses";return;}S.qs={};S.unlock=false;save();TM.left=TOTAL;tStop();go("home");};
}
$("ovClose").onclick=()=>{$("overlay").hidden=true;};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("overlay").hidden=true;});
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(d=>{DL=d;const b=$("dlB");if(b&&d)b.hidden=false;}).catch(()=>{});}catch(e){}

applyFs();applyTheme();tDraw();route();
window.__t={S:()=>S,STEPS,QS,evalQ,QBY,go};

})();
</script>
